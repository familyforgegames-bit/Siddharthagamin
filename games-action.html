<!DOCTYPE html>
<html lang="en">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

tailwind.config={theme:{extend:{colors:{brand:{cyan:'#00f2fe',blue:'#4facfe',purple:'#7f00ff',pink:'#ff007f',gold:'#fbbf24',dark:'#0a0d14',card:'#121824'}}}}}

<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#080b11;color:#f3f4f6;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .tile { border: 1px solid #1f2937; border-radius: 18px; overflow: hidden; background: #121824; cursor: pointer; text-align: left; color: inherit; padding: 0; transition: transform .15s, border-color .15s; }
  .tile:hover,.tile:focus-visible { transform: translateY(-3px); border-color: #ff007f; outline: none; }
  .th { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
  .tx { padding: 12px 14px; }
  .tx b { display: block; font-size: 15px; font-family: 'Orbitron', sans-serif; color: #fff; }
  .tx span { font-size: 12px; color: #9ca3af; margin-top: 4px; display: block; }

  #stage { display:none; height:100%; flex-direction:column; }
  #bar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:#0a0d14; border-bottom:1px solid #1f2937; }
  #bar button { background:#1f2937; color:#fff; border:0; padding:8px 14px; border-radius:10px; font-size:13px; cursor:pointer; }
  #bar button:hover { background:#334155; }

  #lay { flex:1; min-height:0; display:flex; gap:16px; padding:16px; }
  #pl { flex:1; min-width:0; display:flex; flex-direction:column; border-radius:16px; overflow:hidden; background:#0a0d14; border:1px solid #1f2937; position:relative; }
  #cvw { flex:1; min-height:0; position:relative; background:#000; }
  #cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:#000; }

  #tb { display:flex; align-items:center; gap:10px; padding:10px 16px; background:#0a0d14; border-top:1px solid #1f2937; }
  #tb b { font-size:15px; font-family:'Orbitron',sans-serif; color:#00f2fe; }
  .sp { flex:1; }
  #tb button, .pn button { background:#1f2937; color:#fff; border:0; padding:8px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-family:'Orbitron',sans-serif; }
  #tb button:hover, .pn button:hover { background:#334155; }

  #pm { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,8,14,.85); backdrop-filter:blur(6px); z-index:10; }
  .pn { width:min(340px,90%); background:#121824; border:1px solid #2a3446; border-radius:18px; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .pn h2 { margin:0; text-align:center; color:#ff007f; font-family:'Orbitron',sans-serif; font-size:20px; }
  .pn label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:#9ca3af; }
  .pn label.ck { flex-direction:row; align-items:center; gap:8px; color:#f3f4f6; }
  .pn input[type=range], .pn select { width:100%; accent-color:#ff007f; background:#0a0d14; border:1px solid #2a3446; color:#fff; padding:6px; border-radius:8px; }
  .bt { display:flex; gap:8px; flex-wrap:wrap; }
  .bt button { flex:1; }
  .pn .pri { background:linear-gradient(to right, #ff007f, #7f00ff); font-weight:700; }

  #side { width:320px; overflow-y:auto; flex:none; background:#121824; border:1px solid #1f2937; border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:16px; }
  #side h3 { margin:0; font-size:14px; font-family:'Orbitron',sans-serif; color:#fbbf24; display:flex; align-items:center; gap:8px; }

  @media(max-width:820px) {
    #lay { flex-direction:column; overflow-y:auto; }
    #pl { flex:none; height:62vh; }
    #side { width:auto; }
  }
</style>
</head>
<body class="flex flex-col">

  <!-- AUTHENTICATION GATE MODAL -->
  <div id="authModal" class="fixed inset-0 bg-[#080b11]/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-brand-card border border-gray-800 rounded-3xl p-8 shadow-2xl">
      <div class="text-center mb-6">
        <span class="w-16 h-16 rounded-2xl bg-brand-pink/20 text-brand-pink flex items-center justify-center text-2xl mx-auto mb-3"><i class="fa-solid fa-gamepad"></i></span>
        <h2 class="font-orbitron font-black text-2xl text-white">Action Arcade Portal</h2>
        <p class="text-xs text-gray-400 mt-1">Register or log in to track your global high scores across all action games.</p>
      </div>

      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-orbitron text-gray-300 mb-1">Username</label>
          <input type="text" id="authUsername" required class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-brand-pink focus:outline-none" placeholder="e.g. Lionforge17">
        </div>
        <div>
          <label class="block text-xs font-orbitron text-gray-300 mb-1">Password</label>
          <input type="password" id="authPassword" required class="w-full bg-brand-dark border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:border-brand-pink focus:outline-none" placeholder="••••••••">
        </div>
        <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="rememberMe" class="accent-brand-pink rounded"> Remember Me
          </label>
          <button type="button" onclick="toggleAuthMode()" id="authSwitchBtn" class="text-brand-pink hover:underline font-semibold">Need an account? Register</button>
        </div>
        <button type="submit" id="authSubmitBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brand-pink to-brand-purple text-white font-orbitron font-bold text-sm shadow-lg hover:opacity-90 transition-opacity mt-2">Login to Arcade</button>
      </form>
    </div>
  </div>

  <!-- MAIN MENU HUB -->
  <div id="menu" class="p-6 max-w-7xl mx-auto w-full">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-800">
      <div>
        <h1 class="font-orbitron font-black text-3xl text-white">Action Games Arcade</h1>
        <p class="text-xs text-gray-400 mt-1">Pick an action game, compete globally on leaderboards, and test your skills!</p>
      </div>
      <div class="flex items-center gap-4 bg-brand-card px-4 py-2.5 rounded-2xl border border-gray-800">
        <div class="text-right">
          <span class="block text-[10px] text-gray-400 font-mono uppercase">Logged In As</span>
          <span id="currentUsernameDisplay" class="font-orbitron font-bold text-brand-pink text-sm">Player</span>
        </div>
        <button onclick="logoutUser()" class="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 font-semibold transition-colors"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- GAME STAGE -->
  <div id="stage">
    <div id="bar">
      <button id="back">&larr; All Arcade Games</button>
      <div class="flex items-center gap-4">
        <span class="text-xs text-gray-400 font-mono">Difficulty: <b id="diffDisplay" class="text-brand-gold font-orbitron uppercase">Normal</b></span>
        <span class="text-xs text-gray-400 font-mono">Player: <b id="stageUser" class="text-brand-pink font-orbitron">Player</b></span>
      </div>
    </div>
    <div id="lay">
      <div id="pl">
        <div id="cvw">
          <canvas id="cv"></canvas>
          <div id="pm">
            <div class="pn">
              <h2>Paused & Settings</h2>
              <label>⚔️ Difficulty Level
                <select id="diffSelect" onchange="changeDifficulty(this.value)">
                  <option value="easy">Easy (Slower Enemies)</option>
                  <option value="normal" selected>Normal</option>
                  <option value="hard">Hard (Fast & Aggressive)</option>
                </select>
              </label>
              <label>🎵 Music<input type="range" id="vm" min="0" max="100"></label>
              <label>🔊 Sound effects<input type="range" id="vs" min="0" max="100"></label>
              <label class="ck"><input type="checkbox" id="mu"> Mute all sound</label>
              <div class="bt">
                <button id="rs" class="pri">▶ Resume</button>
                <button id="rt">Restart</button>
                <button id="ex">All games</button>
              </div>
            </div>
          </div>
        </div>
        <div id="tb">
          <b id="gn"></b>
          <span class="sp"></span>
          <button id="pb" title="Pause / Settings (P)">⏸ <u>Pause & Settings</u></button>
          <button id="mb" title="Mute / unmute">🔊</button>
          <button id="fb" title="Full screen">⛶ <u>Full screen</u></button>
        </div>
      </div>
      <div id="side">
        <div>
          <h3><i class="fa-solid fa-trophy"></i> Global Leaderboard</h3>
          <div id="gameLeaderboardList" class="space-y-2 mt-3"></div>
        </div>
      </div>
    </div>
  </div>

<script>
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d'),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),R=Math.random;

const LIST=[
 {id:'sky',name:'Sky Fighter',desc:'Dogfight through the skies',e:'✈️',bg:'linear-gradient(135deg,#0b3d91,#4facfe)',help:'Move: mouse, finger or arrow keys. Your jet fires by itself.'},
 {id:'zomb',name:'Zombie Defense',desc:'Survive the night',e:'🧟',bg:'linear-gradient(135deg,#14532d,#65a30d)',help:'Move: WASD, arrows or drag. Your gun aims by itself.'},
 {id:'knight',name:'Knight Run',desc:'Jump, slash, survive',e:'⚔️',bg:'linear-gradient(135deg,#7c2d12,#f59e0b)',help:'Jump: Space or tap left. Slash: X or tap right.'},
 {id:'tank',name:'Tank Battle',desc:'Outgun enemy armor',e:'🛡️',bg:'linear-gradient(135deg,#78350f,#a16207)',help:'Move: WASD, arrows or drag. Your turret aims and fires by itself.'},
 {id:'inv',name:'Alien Invasion',desc:'Stop the alien waves',e:'👾',bg:'linear-gradient(135deg,#4c1d95,#c026d3)',help:'Move: mouse, finger or left/right keys. Ship fires by itself.'},
 {id:'ninja',name:'Ninja Strike',desc:'Slash enemies from both sides',e:'🥷',bg:'linear-gradient(135deg,#111827,#7f1d1d)',help:'Slash: tap left/right side, or Left/Right keys.'},
 {id:'arch',name:'Archer Defense',desc:'Hold the castle wall',e:'🏹',bg:'linear-gradient(135deg,#166534,#a16207)',help:'Hold and aim with mouse or finger to shoot arrows.'},
 {id:'rock',name:'Asteroid Blaster',desc:'Shatter the space rocks',e:'☄️',bg:'linear-gradient(135deg,#0f172a,#475569)',help:'Move: mouse, finger or arrow keys. Ship fires by itself.'},
 {id:'bomb',name:'Bomb Dodge',desc:'Run, dodge, grab coins',e:'💣',bg:'linear-gradient(135deg,#9a3412,#fb923c)',help:'Move: mouse, finger or left/right keys. Stay out of blasts.'},
 {id:'heli',name:'Heli Strike',desc:'Side-scrolling air combat',e:'🚁',bg:'linear-gradient(135deg,#0369a1,#7dd3fc)',help:'Move: mouse, finger or arrow keys. Gun fires by itself.'},
 {id:'snip',name:'Sniper Elite',desc:'Pick off targets in cover',e:'🎯',bg:'linear-gradient(135deg,#334155,#dc2626)',help:'Aim with mouse or finger and tap to shoot. Miss 3 targets and it is over.'},
 {id:'blade',name:'Blade Storm',desc:'Spinning swords vs the horde',e:'🗡️',bg:'linear-gradient(135deg,#581c87,#db2777)',help:'Move: WASD, arrows or drag. Swords spin and strike by themselves.'},
 {id:'laser',name:'Laser Grid',desc:'Dodge deadly beams',e:'⚡',bg:'linear-gradient(135deg,#1e1b4b,#d946ef)',help:'Move: mouse, finger or arrow keys. Red line = beam is coming.'},
 {id:'msl',name:'Missile Evade',desc:'Outfly homing missiles',e:'🚀',bg:'linear-gradient(135deg,#075985,#f97316)',help:'Move: mouse, finger or arrow keys. Make missiles crash into each other.'},
 {id:'boss',name:'Boss Rush',desc:'Bullet-hell boss battles',e:'👹',bg:'linear-gradient(135deg,#3b0764,#e11d48)',help:'Move: mouse, finger or arrow keys. Ship fires by itself.'}
];

let currentUser = null;
let isRegisterMode = false;
let currentDifficulty = 'normal'; // easy, normal, hard
let diffMultiplier = 1;

window.addEventListener('DOMContentLoaded', () => {
  const remembered = localStorage.getItem('action_arcade_user');
  if (remembered) {
    currentUser = JSON.parse(remembered);
    initActionHub();
  } else {
    $('authModal').classList.remove('hidden');
  }
});

function toggleAuthMode() {
  isRegisterMode = !isRegisterMode;
  $('authSwitchBtn').textContent = isRegisterMode ? 'Already have an account? Login' : "Need an account? Register";
  $('authSubmitBtn').textContent = isRegisterMode ? 'Register & Start' : 'Login to Arcade';
}

function handleAuth(e) {
  e.preventDefault();
  const u = $('authUsername').value.trim();
  const p = $('authPassword').value.trim();
  const remember = $('rememberMe').checked;

  let users = JSON.parse(localStorage.getItem('action_arcade_users_db') || '{}');

  if (isRegisterMode) {
    if (users[u]) {
      alert('Username already exists! Please choose another or login.');
      return;
    }
    users[u] = { password: p, scores: {} };
    localStorage.setItem('action_arcade_users_db', JSON.stringify(users));
  } else {
    if (!users[u] || users[u].password !== p) {
      alert('Invalid username or password.');
      return;
    }
  }

  currentUser = { username: u };
  if (remember) {
    localStorage.setItem('action_arcade_user', JSON.stringify(currentUser));
  }

  $('authModal').classList.add('hidden');
  initActionHub();
}

function logoutUser() {
  localStorage.removeItem('action_arcade_user');
  currentUser = null;
  location.reload();
}

function initActionHub() {
  $('currentUsernameDisplay').textContent = currentUser.username;
  $('stageUser').textContent = currentUser.username;
  $('grid').innerHTML = LIST.map((g,i)=>`<button class="tile" onclick="launch(${i})"><div class="th" style="background:${g.bg}">${g.e}</div><div class="tx"><b>${g.name}</b><span>${g.desc}</span></div></button>`).join('');
}

function changeDifficulty(val) {
  currentDifficulty = val;
  $('diffDisplay').textContent = val;
  if(val === 'easy') diffMultiplier = 0.75;
  else if(val === 'hard') diffMultiplier = 1.35;
  else diffMultiplier = 1.0;
}

function getUserHighScore(gameId) {
  if (!currentUser) return 0;
  let users = JSON.parse(localStorage.getItem('action_arcade_users_db') || '{}');
  return users[currentUser.username]?.scores?.[gameId] || 0;
}

function saveUserHighScore(gameId, sc) {
  if (!currentUser) return;
  let users = JSON.parse(localStorage.getItem('action_arcade_users_db') || '{}');
  if (users[currentUser.username]) {
    if (!users[currentUser.username].scores) users[currentUser.username].scores = {};
    if (sc > (users[currentUser.username].scores[gameId] || 0)) {
      users[currentUser.username].scores[gameId] = sc;
      localStorage.setItem('action_arcade_users_db', JSON.stringify(users));
    }
  }
  renderGameLeaderboard(gameId);
}

function renderGameLeaderboard(gameId) {
  let users = JSON.parse(localStorage.getItem('action_arcade_users_db') || '{}');
  let sortedUsers = Object.keys(users).map(username => ({
    username,
    score: users[username].scores?.[gameId] || 0
  })).sort((a, b) => b.score - a.score);

  const container = $('gameLeaderboardList');
  if (!container) return;

  if (sortedUsers.length === 0 || sortedUsers.every(u => u.score === 0)) {
    container.innerHTML = `<p class="text-xs text-gray-500 text-center py-2">No scores recorded yet.</p>`;
    return;
  }

  container.innerHTML = sortedUsers.slice(0, 6).map((u, idx) => {
    let rankColor = idx === 0 ? 'text-yellow-400 bg-yellow-400/10 border-yellow-400/30' : idx === 1 ? 'text-gray-300 bg-gray-300/10 border-gray-300/30' : idx === 2 ? 'text-amber-600 bg-amber-600/10 border-amber-600/30' : 'text-gray-400 bg-brand-dark border-gray-800';
    let isMe = currentUser && currentUser.username === u.username;
    return `
      <div class="flex items-center justify-between p-2 rounded-xl border ${rankColor} ${isMe ? 'ring-2 ring-brand-pink' : ''}">
        <div class="flex items-center gap-2">
          <span class="w-5 h-5 rounded flex items-center justify-center font-orbitron font-bold text-[10px]">${idx + 1}</span>
          <span class="font-orbitron font-semibold text-xs text-white">${u.username}</span>
        </div>
        <span class="font-mono font-bold text-xs text-brand-gold">${u.score} pts</span>
      </div>
    `;
  }).join('');
}

let W,H,dpr=1,g,gi,state='ready',score=0,bs=0,t=0,shake=0,parts=[],keys={},ptr={x:0,y:0,down:false,on:false},raf,last=0,overAt=0;const G={};
function size(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
function best(n,v){return getUserHighScore(n)}
function boom(x,y,col,n){sfx(n>=14?'boom':'hit');for(let i=0;i<n;i++){const a=R()*6.3,s=40+R()*220;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+R()*.5,c:col,r:1+R()*3})}}
function end(){sfx('over');state='over';overAt=performance.now();shake=14; bs = Math.max(bs, score); saveUserHighScore(LIST[gi].id, score); renderGameLeaderboard(LIST[gi].id);}
function reset(){score=0;t=0;shake=0;parts=[];state='ready';bs=getUserHighScore(LIST[gi].id);g.init();renderGameLeaderboard(LIST[gi].id)}
function launch(i){aInit();mStart(i);pause(false);gi=i;g=G[LIST[i].id];$('menu').style.display='none';$('stage').style.display='flex';$('gn').textContent=LIST[i].name;size();reset();cancelAnimationFrame(raf);last=performance.now();loop(last)}
$('back').onclick=()=>{mStop();pause(false);if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);$('pl').classList.remove('pfs');cancelAnimationFrame(raf);g=null;$('stage').style.display='none';$('menu').style.display='block'};
addEventListener('resize',()=>{if(g)size()});try{new ResizeObserver(()=>{if(g)size()}).observe($('cvw'))}catch(e){}
function press(){if(state==='ready'){state='play';sfx('start');return true}if(state==='over'&&performance.now()-overAt>600){reset();state='play';return true}return false}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();keys[k]=1;if(!g)return;if((k==='p'||k==='escape')&&state==='play'){pause(!paused);return}if(paused)return;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(press())return;if(state==='play'&&g.act){g.act(k);sfx('act')}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pp(e){const r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top}
cv.addEventListener('pointerdown',e=>{pp(e);ptr.down=ptr.on=true;if(press())return;if(state==='play'&&g.act){g.act('tap',ptr.x/W);sfx('act')}});
cv.addEventListener('pointermove',e=>{pp(e);if(e.pointerType==='mouse')ptr.on=true});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')ptr.on=false});
addEventListener('pointerup',e=>{ptr.down=false;if(e.pointerType!=='mouse')ptr.on=false});
function txt(s,x,y,sz,col,al){c.font='bold '+sz+'px Orbitron,Segoe UI,sans-serif';c.textAlign=al||'center';c.fillStyle=col||'#fff';c.fillText(s,x,y,W-24)}
function hud(){
  txt('Score '+score,16,30,18,'#fff','left');
  txt('Best '+Math.max(bs,score),W-16,30,14,'#9ca3af','right');
  if(score > bs) { bs = score; saveUserHighScore(LIST[gi].id, score); }
  if(state!=='play'){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,W,H);
  if(state==='ready'){txt(LIST[gi].name,W/2,H/2-40,34,'#00f2fe');txt(LIST[gi].help,W/2,H/2,15,'#e5e7eb');txt('Tap or press Space to start',W/2,H/2+40,16,'#fbbf24')}
  else{txt('Game over',W/2,H/2-40,36,'#ff007f');txt('Score '+score+'   Best '+bs,W/2,H/2,18);txt('Tap or press Space to play again',W/2,H/2+40,16,'#fbbf24')}}}
function loop(ts){raf=requestAnimationFrame(loop);if(!g)return;const dt=Math.min(.033,(ts-last)/1e3||0);last=ts;
 const pd=paused?0:dt;if(state==='play'&&!paused){const k=LIST[gi].id==='arch'?'a':'b',n0=(g[k]||[]).length;t+=dt*diffMultiplier;g.update(dt*diffMultiplier);if((g[k]||[]).length>n0)sfx('shoot')}
 parts.forEach(p=>{p.x+=p.vx*pd;p.y+=p.vy*pd;p.l-=pd});parts=parts.filter(p=>p.l>0);shake=Math.max(0,shake-pd*30);
 c.setTransform(dpr,0,0,dpr,0,0);c.save();if(shake)c.translate((R()-.5)*shake,(R()-.5)*shake);
 g.draw();
 parts.forEach(p=>{c.globalAlpha=Math.min(1,p.l*1.6);c.fillStyle=p.c;c.shadowColor=p.c;c.shadowBlur=8;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()});
 c.restore();c.globalAlpha=1;hud()}

let paused=false;
function pause(v){paused=v;$('pm').style.display=v?'flex':'none';$('pb').firstChild.textContent=v?'▶ ':'⏸ ';if(v)keys={}}
function fs(){const e=$('pl'),d=document,on=d.fullscreenElement||d.webkitFullscreenElement||e.classList.contains('pfs'),rq=e.requestFullscreen||e.webkitRequestFullscreen;
 if(on){if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);e.classList.remove('pfs')}

   c.strokeStyle='rgba(20,20,20,.7)';c.lineWidth=3;const r=Math.sin(t*45)*60;c.beginPath();c.moveTo(p.x-r,p.y-20);c.lineTo(p.x+r,p.y-20);c.stroke();c.fillStyle='#222';c.fillRect(p.x-2,p.y-20,4,6);c.fillRect(p.x-24,p.y+18,50,3)}
  hts(p.hp,3)}
};

/* ---------- 11. SNIPER ELITE ---------- */
G.snip={
 init(){this.cv=[...Array(5)].map((_,i)=>({x:W*(i+.5)/5,y:H*.62+(i%2)*40,up:0,l:0,dead:0}));this.sp=1;this.lives=3;this.combo=0},
 act(k){if(k!=='tap')return;let ok=false;for(const v of this.cv)if(v.l>0&&v.up>.5&&Math.abs(ptr.x-v.x)<30&&ptr.y>v.y-95&&ptr.y<v.y-10){v.l=0;v.up=0;v.dead=.3;ok=true;this.combo++;score+=10+Math.min(10,this.combo);boom(v.x,v.y-60,'#ff4d4d',14)}
  if(!ok)this.combo=0},
 update(dt){this.cv.forEach(v=>{v.dead-=dt;if(v.l>0){v.l-=dt;v.up=Math.min(1,v.up+dt*6);if(v.l<=0){this.lives--;v.up=0;shake=10;this.combo=0;if(this.lives<=0)end()}}else v.up=Math.max(0,v.up-dt*8)});
  if((this.sp-=dt)<=0){this.sp=Math.max(.45,1.2-t*.015);const f=this.cv.filter(v=>v.l<=0&&v.up<.1);if(f.length)f[Math.floor(R()*f.length)].l=Math.max(.75,1.8-t*.02)}},
 draw(){bg('#1e293b','#64748b');c.fillStyle='#0f172a';for(let i=0;i<14;i++){const h=60+(i*37%90);c.fillRect(i*W/14,H*.55-h,W/14-4,h)}c.fillStyle='#334155';c.fillRect(0,H*.55,W,H);
  this.cv.forEach(v=>{const y=v.y-v.up*70;c.fillStyle='#365314';c.fillRect(v.x-12,y-30,24,40);c.fillStyle='#f1c27d';c.beginPath();c.arc(v.x,y-40,10,0,7);c.fill();c.fillStyle='#365314';c.fillRect(v.x-11,y-52,22,7);
   c.fillStyle='#57534e';c.fillRect(v.x-38,v.y,76,70);c.fillStyle='#78716c';c.fillRect(v.x-38,v.y,76,8)});
  const x=ptr.x,y=ptr.y;c.strokeStyle='#ef4444';c.lineWidth=2;c.beginPath();c.arc(x,y,26,0,7);c.moveTo(x-40,y);c.lineTo(x+40,y);c.moveTo(x,y-40);c.lineTo(x,y+40);c.stroke();
  hts(this.lives,3);if(this.combo>1)txt('Combo x'+this.combo,W/2,H-20,16,'#fbbf24')}
};

/* ---------- 12. BLADE STORM ---------- */
G.blade={
 init(){this.p={x:W/2,y:H/2,hp:100,ang:0,a:0};this.e=[];this.sp=0;this.gr=[...Array(120)].map(()=>({x:R()*W,y:R()*H,r:R()*2+1}))},
 tips(){const n=Math.min(6,2+Math.floor(score/200)),p=this.p,o=[];for(let i=0;i<n;i++){const a=p.ang+i*6.283/n;o.push({x:p.x+Math.cos(a)*72,y:p.y+Math.sin(a)*72,a},{x:p.x+Math.cos(a)*44,y:p.y+Math.sin(a)*44,a})}return o},
 update(dt){const p=this.p;wasd(p,220,dt,18);p.ang+=5*dt;const sw=this.tips();
  if((this.sp-=dt)<=0){this.sp=Math.max(.18,.9-t*.01);const s=edge(),big=t>30&&R()<.25;this.e.push({x:s.x,y:s.y,hp:big?4:2,r:big?24:15,v:Math.min(150,65+t*.8+R()*20),cd:0,big})}
  this.e.forEach(e=>{const a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.v*dt;e.y+=Math.sin(a)*e.v*dt;e.cd-=dt;
   if(e.cd<=0&&sw.some(s=>hit(s,e,e.r+10))){e.cd=.25;e.hp--;boom(e.x,e.y,'#c084fc',5);if(e.hp<=0){e.dead=1;score+=e.big?25:10;boom(e.x,e.y,'#a855f7',16)}}
   if(hit(e,p,e.r+14)){p.hp-=22*dt;shake=Math.max(shake,4)}});
  this.e=this.e.filter(e=>!e.dead);if(p.hp<=0)end()},
 draw(){c.fillStyle='#1b1033';c.fillRect(0,0,W,H);this.gr.forEach(d=>{c.fillStyle='#2a1b4d';c.beginPath();c.arc(d.x,d.y,d.r*2,0,7);c.fill()});
  this.e.forEach(e=>{c.fillStyle=e.big?'#7e22ce':'#be185d';c.beginPath();c.arc(e.x,e.y,e.r,0,7);c.fill();c.fillStyle='#fde047';c.fillRect(e.x-e.r*.4,e.y-e.r*.3,4,4);c.fillRect(e.x+e.r*.2,e.y-e.r*.3,4,4)});
  const p=this.p,n=this.tips().length/2;c.shadowBlur=12;c.shadowColor='#67e8f9';c.strokeStyle='#e0f2fe';c.lineWidth=5;
  for(let i=0;i<n;i++){const a=p.ang+i*6.283/n;c.beginPath();c.moveTo(p.x+Math.cos(a)*22,p.y+Math.sin(a)*22);c.lineTo(p.x+Math.cos(a)*76,p.y+Math.sin(a)*76);c.stroke()}c.shadowBlur=0;
  c.fillStyle='#2563eb';c.beginPath();c.arc(p.x,p.y,16,0,7);c.fill();c.fillStyle='#f1c27d';c.beginPath();c.arc(p.x,p.y,8,0,7);c.fill();
  bar(p.hp,100,W/2-70,16,140,p.hp>35?'#22c55e':'#ef4444')}
};

/* ---------- 13. LASER GRID ---------- */
G.laser={
 init(){this.p={x:W/2,y:H/2};this.l=[];this.sp=1.2},
 update(dt){const p=this.p;steer(p,330,dt,0);
  if((this.sp-=dt)<=0){this.sp=Math.max(.45,1.5-t*.02);const h=R()<.5;this.l.push({h,v:h?40+R()*(H-80):30+R()*(W-60),t:0,w:Math.max(.55,1-t*.01)});if(t>25&&R()<.4)this.l.push({h:!h,v:h?30+R()*(W-60):40+R()*(H-80),t:0,w:.8})}
  for(const l of this.l){l.t+=dt;if(l.t>l.w&&l.t<l.w+.45&&Math.abs((l.h?p.y:p.x)-l.v)<13)return end()}
  this.l=this.l.filter(l=>l.t<l.w+.55);score=Math.floor(t*10)},
 draw(){c.fillStyle='#070914';c.fillRect(0,0,W,H);c.strokeStyle='rgba(99,102,241,.15)';c.lineWidth=1;for(let x=-(t*20%40);x<W;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  this.l.forEach(l=>{const on=l.t>l.w;c.save();if(on){c.shadowBlur=22;c.shadowColor='#f0abfc';c.strokeStyle='#fdf4ff';c.lineWidth=14}else{c.strokeStyle='rgba(248,113,113,'+(.3+.5*(l.t/l.w))+')';c.lineWidth=2;c.setLineDash([10,8])}
   c.beginPath();if(l.h){c.moveTo(0,l.v);c.lineTo(W,l.v)}else{c.moveTo(l.v,0);c.lineTo(l.v,H)}c.stroke();c.restore()});
  const p=this.p;c.shadowBlur=18;c.shadowColor='#22d3ee';c.fillStyle='#67e8f9';c.beginPath();c.arc(p.x,p.y,9,0,7);c.fill();c.shadowBlur=0;c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,4,0,7);c.fill()}
};

/* ---------- 14. MISSILE EVADE ---------- */
G.msl={
 init(){this.p={x:W/2,y:H/2};this.m=[];this.sp=1;this.pa=-Math.PI/2;this.bn=0;this.cl=[...Array(7)].map(()=>({x:R()*W,y:R()*H,s:.5+R()}))},
 update(dt){const p=this.p,ox=p.x,oy=p.y;steer(p,300,dt,0);if(Math.hypot(p.x-ox,p.y-oy)>.1)this.pa=Math.atan2(p.y-oy,p.x-ox);
  if((this.sp-=dt)<=0){this.sp=Math.max(1,3-t*.03);const s=edge();this.m.push({x:s.x,y:s.y,a:Math.atan2(p.y-s.y,p.x-s.x),l:7})}
  const v=Math.min(300,210+t*1.5);
  this.m.forEach(m=>{const d=((Math.atan2(p.y-m.y,p.x-m.x)-m.a+Math.PI*3)%(Math.PI*2))-Math.PI;m.a+=cl(d,-1.7*dt,1.7*dt);m.x+=Math.cos(m.a)*v*dt;m.y+=Math.sin(m.a)*v*dt;m.l-=dt;
   parts.push({x:m.x-Math.cos(m.a)*12,y:m.y-Math.sin(m.a)*12,vx:0,vy:0,l:.4,c:'#cbd5e1',r:2});if(m.l<=0){m.dead=1;this.bn+=5;boom(m.x,m.y,'#fb923c',16)}});
  for(let i=0;i<this.m.length;i++)for(let j=i+1;j<this.m.length;j++){const a=this.m[i],b=this.m[j];if(!a.dead&&!b.dead&&hit(a,b,14)){a.dead=b.dead=1;this.bn+=15;boom(a.x,a.y,'#fb923c',24);shake=6}}
  if(this.m.some(m=>!m.dead&&hit(m,p,16))){boom(p.x,p.y,'#ff7b39',30);return end()}
  this.m=this.m.filter(m=>!m.dead);score=Math.floor(t*2)+this.bn},
 draw(){bg('#0c4a6e','#bae6fd');c.fillStyle='rgba(255,255,255,.55)';this.cl.forEach(k=>{const y=(k.y+t*30*k.s)%(H+60)-30;c.beginPath();c.ellipse(k.x,y,60*k.s,20*k.s,0,0,7);c.fill()});
  this.m.forEach(m=>{c.save();c.translate(m.x,m.y);c.rotate(m.a);c.fillStyle='#e5e7eb';c.fillRect(-12,-4,24,8);c.fillStyle='#dc2626';c.beginPath();c.moveTo(12,-4);c.lineTo(20,0);c.lineTo(12,4);c.fill();c.fillRect(-12,-8,6,16);c.fillStyle='#fbbf24';c.beginPath();c.arc(-14,0,3+R()*3,0,7);c.fill();c.restore()});
  const p=this.p;c.save();c.translate(p.x,p.y);c.rotate(this.pa+Math.PI/2);c.scale(.8,.8);jet(0,0,'#4facfe',0);c.restore()}
};

/* ---------- 15. BOSS RUSH ---------- */
G.boss={
 init(){this.p={x:W/2,y:H-90,hp:3,cd:0,inv:0};this.b=[];this.eb=[];this.lv=1;this.st=mkst();this.nb()},
 nb(){this.bs={x:W/2,y:100,hp:60+this.lv*30,mx:60+this.lv*30,d:1,cd:1.5,ph:0,ang:0};this.eb=[]},
 update(dt){const p=this.p,B=this.bs;steer(p,400,dt,40);p.y=Math.max(p.y,H*.45);p.inv-=dt;
  if((p.cd-=dt)<=0){p.cd=.12;this.b.push({x:p.x-8,y:p.y-20},{x:p.x+8,y:p.y-20})}
  B.x+=B.d*(80+this.lv*15)*dt;if(B.x>W-70)B.d=-1;if(B.x<70)B.d=1;B.cd-=dt;B.ang+=dt*2;
  if(B.cd<=0){B.ph=(B.ph+1)%3;B.cd=1.1-Math.min(.5,this.lv*.06);const sp=170+this.lv*12,n=14+this.lv*2;
   if(B.ph===0)for(let i=0;i<n;i++){const a=i/n*6.283+B.ang;this.eb.push({x:B.x,y:B.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp})}
   else if(B.ph===1){const a0=Math.atan2(p.y-B.y,p.x-B.x);for(let i=-2;i<3;i++){const a=a0+i*.22;this.eb.push({x:B.x,y:B.y,vx:Math.cos(a)*sp*1.4,vy:Math.sin(a)*sp*1.4})}}
   else for(let i=0;i<5;i++)this.eb.push({x:B.x-80+i*40,y:B.y+20,vx:0,vy:sp*1.2})}
  this.b.forEach(b=>b.y-=800*dt);this.eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});
  for(const b of this.b)if(!b.d&&Math.abs(b.x-B.x)<55&&Math.abs(b.y-B.y)<35){b.d=1;B.hp--;score+=1;boom(b.x,b.y,'#ffd166',2)}
  if(B.hp<=0){score+=100;boom(B.x,B.y,'#ff7b39',60);shake=14;this.lv++;this.nb()}
  if(p.inv<=0&&this.eb.some(b=>hit(b,p,9))){p.hp--;p.inv=1.5;shake=14;boom(p.x,p.y,'#4facfe',25);this.eb=[];if(p.hp<=0)return end()}
  this.b=this.b.filter(b=>!b.d&&b.y>-20);this.eb=this.eb.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20)},
 draw(){bg('#09040f','#2b0f33');stars(this.st);const B=this.bs;
  c.fillStyle='#6d28d9';c.beginPath();c.ellipse(B.x,B.y,60,34,0,0,7);c.fill();c.fillStyle='#4c1d95';c.fillRect(B.x-90,B.y-6,34,12);c.fillRect(B.x+56,B.y-6,34,12);
  c.fillStyle='#f43f5e';c.beginPath();c.arc(B.x,B.y,12+Math.sin(t*6)*2,0,7);c.fill();c.fillStyle='#fde047';c.fillRect(B.x-30,B.y-10,8,6);c.fillRect(B.x+22,B.y-10,8,6);
  c.shadowBlur=10;c.shadowColor='#ffd166';c.fillStyle='#ffe29a';this.b.forEach(b=>c.fillRect(b.x-2,b.y,4,14));c.shadowColor='#ff3b6b';c.fillStyle='#fb7185';this.eb.forEach(b=>{c.beginPath();c.arc(b.x,b.y,6,0,7);c.fill()});c.shadowBlur=0;
  const p=this.p;if(p.inv<=0||Math.floor(t*12)%2){jet(p.x,p.y,'#4facfe',0);c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,3,0,7);c.fill()}
  bar(B.hp,B.mx,W/2-120,48,240,'#a855f7');txt('Boss '+this.lv,W/2,72,12,'#c4b5fd');hts(p.hp,3)}
};
</script>
