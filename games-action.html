<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Fighter 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
:root{--c:#ff3d8b;--bg:#05070c;--pn:#0c101a;--bd:#1e293b;--mut:#94a3b8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;touch-action:manipulation}
.b{padding:.5rem .9rem;border-radius:.7rem;border:1px solid #334155;background:var(--pn);color:#e5e7eb;font-size:.82rem;cursor:pointer;transition:.15s}
.b:hover{border-color:var(--c);transform:translateY(-1px)}.b.on{background:var(--c);color:#05070c;font-weight:700;border-color:var(--c)}.b.big{width:100%;margin-top:14px;padding:.8rem;font-size:1rem}
.in{width:100%;padding:.65rem;border-radius:.6rem;background:var(--pn);border:1px solid #334155;color:#fff;margin-top:.5rem;color-scheme:dark}
.scr{position:fixed;inset:0;z-index:30}
#login{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a1325,#05070c)}
.lcard{width:min(340px,92vw);padding:28px;border-radius:20px;background:#0c101acc;border:1px solid var(--bd)}
#menu{display:none;flex-direction:column;background:radial-gradient(ellipse at 30% 0,#3f1030,#05070c 60%)}
.mtop{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--bd)}.logo{font-weight:900;letter-spacing:.12em;color:var(--c);font-size:18px}.sp{flex:1}
.mwrap{flex:1;display:flex;min-height:0}.mmain{flex:1;overflow:auto;padding:20px}.mmain h2{margin:0 0 14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gc{padding:20px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 22%,#0c101a),#0c101a 70%);border:1px solid color-mix(in srgb,var(--g) 45%,#1e293b);cursor:pointer;transition:.2s}
.gc:hover{transform:translateY(-4px);box-shadow:0 10px 30px color-mix(in srgb,var(--g) 30%,transparent)}
.ge{font-size:44px}.gc h3{margin:8px 0 4px}.gc p{margin:0 0 12px;font-size:12px;color:var(--mut);min-height:48px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:11px;padding:3px 8px;border-radius:99px;background:#ffffff14}
.side{width:300px;overflow:auto;padding:16px;background:#0a0d16cc;border-left:1px solid var(--bd)}
.side h3,.sl{font-size:11px;letter-spacing:.15em;color:var(--mut);margin:16px 0 8px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:6px 9px;border-radius:8px;background:#0f1422;margin-bottom:4px}.me{outline:1px solid var(--c)}.mut{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:6px;background:var(--bd);margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff3d8b,#7f00ff)}
#portal{display:none;z-index:40;align-items:center;justify-content:center;background:#000a}
.modal{width:min(560px,94vw);max-height:92dvh;overflow:auto;padding:22px;border-radius:20px;background:var(--pn);border:1px solid #334155}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}.mt{font-size:24px;font-weight:800}.ms{font-size:12px;color:var(--mut)}
.sg{margin-top:12px}.so{display:flex;gap:6px;flex-wrap:wrap}.sg .sl{margin:0 0 6px}
#game{display:none;position:fixed;inset:0;z-index:20}#cv{position:absolute;inset:0;touch-action:none;cursor:none}#gbar,#gside,#res,#spb{cursor:default}#spb{position:absolute;right:16px;bottom:16px;z-index:6;display:none;padding:14px 20px}#cv canvas{display:block}
#gbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:5}#gtitle{font-weight:800;margin:0 8px;text-shadow:0 1px 3px #000,0 0 10px #000}.b:disabled{opacity:.4;pointer-events:none}
#ptop{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;pointer-events:none}
.pc{padding:8px 14px;border-radius:12px;background:#0c101acc;border:1px solid var(--bd);font-size:13px;font-weight:700;white-space:nowrap}
#xh{display:none;position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid #ff3d8b;border-radius:50%;z-index:4;pointer-events:none}
#xh:before,#xh:after{content:"";position:absolute;background:#ff3d8b}#xh:before{left:21px;top:-8px;width:2px;height:58px}#xh:after{top:21px;left:-8px;height:2px;width:58px}
#gstat{position:absolute;left:12px;bottom:12px;z-index:5;padding:10px 14px;border-radius:14px;background:#0c101acc;border:1px solid var(--bd);max-width:420px;font-size:12px;color:var(--mut);pointer-events:none}
#gside{position:absolute;top:0;right:0;bottom:0;width:280px;overflow:auto;padding:14px;background:#0a0d16d9;border-left:1px solid var(--bd);z-index:4}#gside.hid{display:none}
#res{display:none;position:absolute;inset:0;z-index:8;background:#0008;align-items:center;justify-content:center}
.rb{width:min(380px,92vw);text-align:center;padding:26px;border-radius:20px;background:var(--pn);border:1px solid var(--c)}.rb h2{margin:0 0 6px;font-size:28px}.xp{color:#fbbf24;font-weight:800;font-size:20px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:none;padding:10px 18px;border-radius:12px;background:#0c101af0;border:1px solid var(--c);font-weight:600}
@media(max-width:800px){.mwrap{flex-direction:column;overflow:auto}.mmain{flex:none;overflow:visible}.side{width:auto;flex:none;border-left:0;border-top:1px solid var(--bd)}#gside{top:auto;left:0;right:0;width:auto;max-height:34dvh;border-left:0;border-top:1px solid var(--bd)}input,select{font-size:16px}#gstat{display:none}}
#menu{background:linear-gradient(180deg,#0e2a5c 0%,#5b2a52 45%,#05070c 85%)}
.tabs{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap}.tabs .b{padding:.6rem 1.2rem;font-weight:700}
.hero{display:flex;align-items:center;gap:20px;padding:22px;border-radius:20px;background:linear-gradient(120deg,#38bdf833,#ff3d8b22);border:1px solid #38bdf855;margin-bottom:14px}
.hero h1{margin:0;font-size:32px;letter-spacing:.08em;color:#fff;text-shadow:0 0 18px #38bdf8}.hero p{margin:6px 0 0;color:var(--mut);font-size:13px}.hj{font-size:72px;transform:rotate(-20deg);filter:drop-shadow(0 0 16px #38bdf8)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 14px}.pg{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.mc,.pk{padding:12px;border-radius:14px;background:#0c101acc;border:1px solid var(--bd);cursor:pointer;font-size:13px}.mc.sel,.pk.sel{border-color:var(--c);box-shadow:0 0 18px #ff3d8b55}.mc.lk{opacity:.4;cursor:default}
.pk{cursor:default}.pk h3{margin:4px 0}.pj{font-size:54px;text-shadow:0 0 14px currentColor;transform:rotate(-20deg);display:inline-block}.pk .b{width:100%;margin-top:10px}
.sr{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-top:4px}.sr span{width:62px}.sbar{flex:1;height:6px;border-radius:5px;background:var(--bd);overflow:hidden}.sbar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#ff3d8b)}
#warn{position:absolute;top:112px;left:50%;transform:translateX(-50%);z-index:6;padding:10px 20px;border-radius:12px;background:#7f1d1dd9;border:2px solid #ff3b3b;font-weight:800;letter-spacing:.05em;display:none;animation:bl .4s infinite alternate;pointer-events:none;white-space:nowrap}@keyframes bl{to{background:#ff2a2add}}
#flb{position:absolute;right:16px;bottom:78px;z-index:6;display:none;padding:12px 18px;cursor:default}
#spb,#flb{position:absolute!important;right:18px!important;z-index:7!important;font-weight:800;border-radius:14px}
#spb{bottom:18px!important;padding:16px 22px!important;font-size:1rem;background:linear-gradient(135deg,#ff3d8b,#ff7a18)!important;box-shadow:0 0 24px #ff3d8b88;color:#fff!important}
#flb{bottom:92px!important;background:#0c101acc}
#game:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 170px rgba(0,0,0,.6)}
.pc{backdrop-filter:blur(6px);box-shadow:0 4px 18px #0007}#ptop .pc small{font-size:9px;color:#94a3b8;margin-left:6px}
</style></head><body>
<div id="login" class="scr"><div class="lcard">
<h1 style="font-size:22px;font-weight:800;margin:0 0 4px;color:#ff3d8b">SKY FIGHTER 3D</h1>
<p style="font-size:12px;color:#94a3b8;margin:0 0 14px">Sign in to track your level, high scores and rank.</p>
<div style="display:flex;gap:8px"><button class="b on" id="tNew" onclick="setTab('new')">New user</button><button class="b" id="tOld" onclick="setTab('old')">Existing user</button></div>
<input id="uName" class="in" placeholder="Username" maxlength="16" autocomplete="username"><input id="uPass" class="in" type="password" placeholder="Password" autocomplete="current-password"><select id="uCountry" class="in"></select>
<div id="err" style="color:#f87171;font-size:12px;min-height:16px;margin-top:8px"></div><button class="b on" style="width:100%;margin-top:6px" onclick="submitLogin()">Continue</button></div></div>
<div id="menu" class="scr"><div class="mtop"><div class="logo">✈ SKY FIGHTER 3D</div><div class="sp"></div><span class="pc" id="mcoin"></span><button class="b" onclick="togMute()">🔊</button><button class="b" onclick="fs()">⛶</button><button class="b" onclick="logout()">Log out</button></div>
<div class="tabs"><button class="b" data-t="play" onclick="tabSet('play')">▶ Play</button><button class="b" data-t="hangar" onclick="tabSet('hangar')">🛩 Hangar</button><button class="b" data-t="rank" onclick="tabSet('rank')">🏆 Ranking</button><button class="b" data-t="opt" onclick="tabSet('opt')">⚙ Options</button></div>
<div class="mwrap"><div class="mmain" id="mmain"></div><aside class="side" id="mside"></aside></div></div>
<div id="game"><div id="cv"></div><div id="xh"></div>
<div id="gbar"><button class="b" onclick="exitGame()">← Menu</button><span id="gtitle"></span><button class="b" id="pbtn" onclick="togPause()">⏸ Pause</button><button class="b" onclick="rematch()">↻ Restart</button><button class="b" onclick="fs()">⛶</button><button class="b" onclick="togSide()">☰ Panel</button><button class="b" onclick="togMute()">🔊</button></div>
<div id="ptop"></div><div id="warn"></div><div id="gstat"></div><aside id="gside" class="hid"></aside><button class="b on" id="spb" onclick="S&&(S.spk=1)">🚀 MISSILE</button><button class="b" id="flb" onclick="S&&(S.flr=1)">🔥 FLARE (F)</button><div id="res"></div></div>
<div id="toast"></div>
<script>
const $=i=>document.getElementById(i),R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),flag=c=>[...(c||'')].map(x=>String.fromCodePoint(127397+x.charCodeAt(0))).join('');
const CN="AE:United Arab Emirates,US:United States,GB:United Kingdom,CA:Canada,AU:Australia,IN:India,PK:Pakistan,PH:Philippines,NG:Nigeria,ZA:South Africa,EG:Egypt,SA:Saudi Arabia,TR:Turkey,DE:Germany,FR:France,ES:Spain,IT:Italy,BR:Brazil,MX:Mexico,CN:China,JP:Japan,KR:South Korea,ID:Indonesia,RU:Russia,KE:Kenya,QA:Qatar,KW:Kuwait,OM:Oman,BH:Bahrain,JO:Jordan,MA:Morocco".split(',').map(s=>s.split(':'));
$('uCountry').innerHTML='<option value="">Country…</option>'+CN.map(([c,n])=>`<option value="${c}">${flag(c)} ${n}</option>`).join('');
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}
function fs(){const d=document;d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen().catch(()=>toast('Full screen blocked'))}
let AC=null,mute=false;function snd(f=440,d=.08,t='square',v=.05,f2){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function togMute(){mute=!mute;toast(mute?'Sound off':'Sound on')}
/* accounts (same arena_db as the Brain Games page, so one login works for both) */
let mem={},user=null,tab='new';
const db=()=>{try{const s=localStorage.getItem('arena_db');return s?JSON.parse(s):mem}catch(e){return mem}},sv=d=>{mem=d;try{localStorage.setItem('arena_db',JSON.stringify(d))}catch(e){}};
async function H(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('arena:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return''+h}}
const err=m=>$('err').textContent=m;
function setTab(t){tab=t;$('uCountry').style.display=t==='new'?'block':'none';$('tNew').className='b'+(t==='new'?' on':'');$('tOld').className='b'+(t==='old'?' on':'');err('')}
async function submitLogin(){const u=$('uName').value.trim(),p=$('uPass').value,d=db(),k=u.toLowerCase();
 if(!/^[A-Za-z0-9_]{3,16}$/.test(u))return err('Username: 3-16 letters, numbers or _');if(p.length<4)return err('Password needs at least 4 characters');
 if(tab==='new'){if(d[k])return err('That username is taken');if(!$('uCountry').value)return err('Please choose your country');d[k]={name:u,hash:await H(p),country:$('uCountry').value,xp:0,stats:{}};sv(d)}
 else if(!d[k]||d[k].hash!==await H(p))return err('Wrong username or password');
 try{localStorage.setItem('arena_sess',k)}catch(e){}user=k;showMenu()}
function logout(){try{localStorage.removeItem('arena_sess')}catch(e){}location.reload()}setTab('new');
const st=(u,g)=>{const s=u.stats[g]||(u.stats[g]={});for(const k of['w','l','d','xp'])s[k]=s[k]||0;if(s.best===undefined)s.best=null;return s};
const lvl=xp=>Math.floor(Math.sqrt(xp/40))+1,lo=L=>40*(L-1)**2,TITLES=['Rookie','Challenger','Tactician','Expert','Master','Grandmaster'];
function prof(){const u=db()[user],L=lvl(u.xp),a=lo(L),b=lo(L+1),pc=Math.round((u.xp-a)/(b-a)*100);
 return `<div style="font-size:18px;font-weight:800">${flag(u.country)} ${esc(u.name)}</div><div style="color:#fbbf24;font-size:13px;font-weight:700;margin-top:2px">Level ${L} · ${TITLES[Math.min(5,Math.floor((L-1)/3))]}</div><div class="bar"><i style="width:${pc}%"></i></div><div class="mut">${u.xp} XP · ${b-u.xp} to Level ${L+1}</div>`}
function lb(g,n=8){const d=db(),me=d[user]&&d[user].name,rows=Object.values(d).map(u=>({u,s:u.stats[g]||{}})).filter(r=>r.s.best!=null).sort((a,b)=>b.s.best-a.s.best).slice(0,n);
 return rows.length?rows.map((r,i)=>`<div class="row ${r.u.name===me?'me':''}"><span>${i+1}. ${flag(r.u.country)} ${esc(r.u.name)}</span><span>${r.s.best} pts · Lv ${lvl(r.u.xp)}</span></div>`).join(''):'<div class="mut">No scores yet. Be the first!</div>'}
/* game list */
const GM={jet:{n:'Sky Fighter',e:'✈️'}};
const MN=['Border Patrol','Convoy Hunt','Valley Strike','Armor Breaker','Iron Storm','Deep Raid','Red Dawn','Final Offensive'],MG=m=>600+m*500,
WL=[[1,'Guns + 5 homing missiles per level (refilled each level)'],[3,'Quad guns'],[4,'Missile salvo x2'],[5,'Overdrive fire rate'],[6,'Heavy warheads: bigger blast'],[7,'Armor-piercing rounds: double damage']],
HELP=['Mouse: fly and aim (crosshair turns red on target)','LEFT CLICK: machine guns','RIGHT CLICK / Space: homing missile (5 per level, refilled on level up)','F: flares - decoy incoming missiles. You can also shoot missiles down','P: pause'],
PL=[{n:'F-16 Falcon',c:0x8a93a0,t:0,price:0,lv:1,hp:0,ag:1,fr:1,ms:0,md:0,gd:1,d:'Balanced starter fighter.'},
{n:'F-22 Raptor',c:0x4b6fa5,t:1,price:1500,lv:2,hp:1,ag:1.15,fr:1.1,ms:2,md:1,gd:1.1,d:'Agile air-superiority jet with canards.'},
{n:'Su-57 Felon',c:0xa33b3b,t:2,price:4000,lv:4,hp:1,ag:1.3,fr:1.2,ms:4,md:1,gd:1.25,d:'Delta wing, fast and deadly.'},
{n:'F-35 Stealth',c:0x2b2f36,t:3,price:8000,lv:6,hp:2,ag:1.35,fr:1.3,ms:6,md:2,gd:1.4,d:'Heavy stealth strike fighter.'},
{n:'Golden Eagle',c:0xd4a017,t:4,price:15000,lv:9,hp:3,ag:1.5,fr:1.5,ms:8,md:3,gd:1.6,d:'Elite prototype. Best of everything.'}];
const NET={id:Math.random().toString(36).slice(2,9),ch:null,peers:{},init(){try{this.ch=new BroadcastChannel('arena_v2');this.ch.onmessage=e=>{const m=e.data;if(m&&m.k==='hi'&&m.from!==this.id)this.peers[m.from]={n:m.n,c:m.c,g:m.g,t:Date.now()}}}catch(e){}setInterval(()=>this.tick(),2000)},
 tick(){const now=Date.now();for(const k in this.peers)if(now-this.peers[k].t>7000)delete this.peers[k];if(user&&db()[user]){const u=db()[user];try{this.ch&&this.ch.postMessage({k:'hi',from:this.id,n:u.name,c:u.country,g:S?S.g:''})}catch(e){}}document.querySelectorAll('.olist').forEach(e=>e.innerHTML=olHTML())}};NET.init();
function olHTML(){const ps=Object.values(NET.peers);return ps.length?ps.map(p=>`<div class="row"><span>🟢 ${flag(p.c)} ${esc(p.n)}</span><span>${p.g&&GM[p.g]?GM[p.g].n:'In menu'}</span></div>`).join(''):'<div class="mut">No one else online right now.</div>'}
const hideAll=()=>['login','menu','game','spb','flb'].forEach(i=>$(i).style.display='none');
let tabM='play',selM=1,dif=2;
const U=()=>db()[user],own=()=>U().own||[0],sel=()=>{const u=U(),i=u.sel||0;return(u.own||[0]).includes(i)?i:0};
const tabSet=t=>{tabM=t;showMenu()},setMi=i=>{selM=i;showMenu()},setD=v=>{dif=v;showMenu()},go=()=>begin({g:'jet',diff:dif,si:sel(),mi:selM}),pick=i=>{const d=db();d[user].sel=i;sv(d);showMenu()};
function buy(i){const d=db(),u=d[user],p=PL[i];if(lvl(u.xp)<p.lv)return toast('Reach pilot level '+p.lv+' first');if((u.coins||0)<p.price)return toast('Not enough coins: need '+p.price);u.coins-=p.price;u.own=[...(u.own||[0]),i];u.sel=i;sv(d);toast('Unlocked '+p.n+'!');showMenu()}
const sb=(l,v,m)=>`<div class="sr"><span>${l}</span><div class="sbar"><i style="width:${Math.min(100,v/m*100)}%"></i></div></div>`,
dfb=()=>`<div class="sg"><div class="sl">Difficulty</div><div class="so">${[[1,'Easy'],[2,'Medium'],[3,'Hard']].map(([v,t])=>`<button class="b ${v===dif?'on':''}" onclick="setD(${v})">${t}</button>`).join('')}</div></div>`;
const OP={p:1,h:1,t:1},tgO=k=>{OP[k]=!OP[k];if(!OP.p&&!OP.h&&!OP.t)OP[k]=1;showMenu()},opb=()=>`<div class="sg"><div class="sl">Opponents (pick any)</div><div class="so">${[['p','✈️ Planes'],['h','🚁 Helicopters'],['t','🪖 Tanks & troops']].map(([k,t])=>`<button class="b ${OP[k]?'on':''}" onclick="tgO('${k}')">${t}</button>`).join('')}<button class="b" onclick="OP.p=OP.h=OP.t=1;showMenu()">All</button></div></div>`;
