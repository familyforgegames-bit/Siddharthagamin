<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Adventure Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b11;color:#f3f4f6;font-family:'Segoe UI',system-ui,sans-serif}
button{font:inherit}
#menu{padding:20px;max-width:1100px;margin:auto}h1{margin:0 0 4px;font-size:26px}.s{color:#9ca3af;margin:0 0 20px;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.tile{border:1px solid #1f2937;border-radius:18px;overflow:hidden;background:#121824;cursor:pointer;text-align:left;color:inherit;padding:0;transition:.15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:#00f2fe;outline:none}
.th{height:120px;display:flex;align-items:center;justify-content:center;font-size:54px}.tx{padding:12px 14px}.tx b{display:block;font-size:15px}.tx span{font-size:12px;color:#9ca3af}
#st{display:none;height:100%;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0a0d14;border-bottom:1px solid #1f2937}
#bar button,.pn button{background:#1f2937;color:#fff;border:0;padding:8px 12px;border-radius:10px;cursor:pointer}#bar button:hover,.pn button:hover{background:#334155}.sp{flex:1}
#cw{flex:1;min-height:0;position:relative;background:#000}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;background:rgba(5,8,14,.6);pointer-events:none}
#msg h2{margin:0;font-size:34px;color:#00f2fe}#msg p{margin:0;color:#e5e7eb}#msg .y{color:#fbbf24}
#pm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,14,.8)}
.pn{background:#121824;border:1px solid #2a3446;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;width:min(300px,90%)}.pn h2{margin:0;text-align:center;color:#00f2fe}
</style></head><body>
<div id="menu"><h1>🗺️ 3D Adventure Games</h1><p class="s">Pick a game and play. Best scores are saved on this device.</p><div id="grid"></div></div>
<div id="st"><div id="bar"><button id="back">&larr; All games</button><b id="gn"></b><span class="sp"></span><button id="pb">⏸</button><button id="mb">🔊</button><button id="fb">⛶</button></div>
<div id="cw"><canvas id="cv"></canvas><div id="hud"></div><div id="msg"></div>
<div id="pm"><div class="pn"><h2>Paused</h2><button id="rs">▶ Resume</button><button id="rt">Restart</button><button id="ex">All games</button></div></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),T=THREE,cv=$('cv');
const ren=new T.WebGLRenderer({canvas:cv,antialias:true}),cam=new T.PerspectiveCamera(60,1,.1,200),ray=new T.Raycaster();
let scene,ground,M,C,gi,state='ready',score=0,bs=0,lv=0,t=0,W=1,H=1,PT=[],keys={},ptr={nx:0,ny:0,down:false,on:false},raf,last=0,overAt=0,paused=false,muted=false,ac,hs='';
const HELP={run:'A/D or ←/→ switch lane · Space/↑ jump<br>Touch: tap left/right side to switch lane, middle to jump',exp:'WASD / arrows, or hold your finger to move<br>Collect the loot, escape the hunters',fly:'Mouse, finger or arrow keys to steer<br>Fly through rings, dodge hazards',shoot:'Click or tap monsters to destroy them<br>Don\'t let them reach the tower'};
const TAG={run:'Runner',exp:'Explorer',fly:'Flight',shoot:'Siege'};
const L=[
{n:'Jungle Run',e:'🌴',m:'run',d:'Sprint through the jungle',k:0x8fd9a8,g:0x2e7d32,en:0x7b4a2a,pk:0xffd54f,ps:'s',es:'b'},
{n:'Desert Dash',e:'🏜️',m:'run',d:'Outrun the sandstorm',k:0xf6d8a0,g:0xd9a441,en:0x8d5a2b,pk:0xffeb3b,ps:'d',es:'c'},
{n:'Snow Slide',e:'⛷️',m:'run',d:'Weave through frozen pines',k:0xcfe8ff,g:0xf5faff,en:0x1b5e20,pk:0x4fc3f7,ps:'d',es:'c'},
{n:'Lava Escape',e:'🌋',m:'run',d:'Run from the volcano',k:0x3a0d0d,g:0x4a1a12,en:0xff5722,pk:0xffc107,ps:'s',es:'b'},
{n:'Temple Escape',e:'🏛️',m:'run',d:'Flee the ancient ruins',k:0x5b6b7a,g:0x6d6a5c,en:0x37474f,pk:0x00e5ff,ps:'d',es:'b'},
{n:'Treasure Island',e:'🏝️',m:'exp',d:'Loot chests, dodge crabs',k:0x7fd1ff,g:0xe6cf8f,en:0xe53935,pk:0xffd700,ps:'b',es:'s'},
{n:'Haunted Mansion',e:'👻',m:'exp',d:'Find the keys, flee ghosts',k:0x14122b,g:0x2b2a3d,en:0xe0e0ff,pk:0xffb300,ps:'d',es:'s'},
{n:'Crystal Cave',e:'💎',m:'exp',d:'Mine gems, avoid golems',k:0x120a2b,g:0x2a1f4a,en:0x7e57c2,pk:0x18ffff,ps:'d',es:'c'},
{n:'Forest Quest',e:'🍄',m:'exp',d:'Gather berries, escape wolves',k:0x9ad9a2,g:0x3f8f3a,en:0x5d4037,pk:0xff5252,ps:'s',es:'b'},
{n:'Pirate Cove',e:'☠️',m:'exp',d:'Steal gold from the pirates',k:0x89c9e8,g:0x2f6f8f,en:0x263238,pk:0xffca28,ps:'b',es:'c'},
{n:'Dragon Rider',e:'🐉',m:'fly',d:'Soar through fire rings',k:0xffa36b,g:0x5a2d2d,en:0x37474f,pk:0xffd740,ps:'t',es:'s'},
{n:'Sky Islands',e:'☁️',m:'fly',d:'Glide between floating isles',k:0x9fd3ff,g:0x6fb7e9,en:0x8d6e63,pk:0x76ff03,ps:'t',es:'b'},
{n:'Canyon Flight',e:'🦅',m:'fly',d:'Thread the red canyon',k:0xf2b880,g:0xb5652b,en:0x8d4a1f,pk:0x00e5ff,ps:'t',es:'c'},
{n:'Monster Siege',e:'🏰',m:'shoot',d:'Defend your castle tower',k:0x2b3a67,g:0x3a5a40,en:0x8e24aa,pk:0,ps:'s',es:'s'},
{n:'Zombie Village',e:'🧟',m:'shoot',d:'Hold the village at night',k:0x30403a,g:0x4a5d3a,en:0x6aa84f,pk:0,ps:'s',es:'b'},
{n:'Skeleton Crypt',e:'💀',m:'shoot',d:'Smash the undead horde',k:0x1a1a24,g:0x33333f,en:0xeeeeee,pk:0,ps:'s',es:'c'}];
const hx=n=>'#'+n.toString(16).padStart(6,'0');
$('grid').innerHTML=L.map((g,i)=>`<button class="tile" onclick="launch(${i})"><div class="th" style="background:linear-gradient(135deg,${hx(g.k)},${hx(g.g)})">${g.e}</div><div class="tx"><b>${g.n}</b><span>${TAG[g.m]} · ${g.d}</span></div></button>`).join('');

/* ---------- helpers ---------- */
const mk=(sh,s,col,gl)=>{const g={s:()=>new T.SphereGeometry(s,16,12),b:()=>new T.BoxGeometry(s*1.6,s*1.6,s*1.6),c:()=>new T.ConeGeometry(s,s*2,7),d:()=>new T.OctahedronGeometry(s),t:()=>new T.TorusGeometry(s,s*.12,8,24)}[sh]();return new T.Mesh(g,new T.MeshLambertMaterial({color:col,emissive:gl?col:0,emissiveIntensity:.5}))};
const A=(m,x,y,z)=>{m.position.set(x||0,y||0,z||0);scene.add(m);return m};
function beep(f,d,ty){if(muted)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function boom(p,col,n){beep(n>8?120:300,.15,'sawtooth');for(let i=0;i<n;i++){const m=mk('b',.12,col,1);m.position.copy(p);scene.add(m);PT.push({m,v:new T.Vector3((R()-.5)*8,R()*6,(R()-.5)*8),l:.7})}}
function best(i,v){try{const k='adv3d_'+i,b=+localStorage.getItem(k)||0;if(v>b){localStorage.setItem(k,v);return v}return b}catch(e){return v}}
function showMsg(){const m=$('msg');if(state==='play'){m.style.display='none';return}m.style.display='flex';m.innerHTML=state==='ready'?`<h2>${C.e} ${C.n}</h2><p>${HELP[C.m]}</p><p class="y">Tap or press Space to start</p>`:`<h2 style="color:#ff007f">Game over</h2><p>Score ${score} · Best ${bs}</p><p class="y">Tap or press Space to play again</p>`}
function end(){state='over';overAt=performance.now();bs=best(gi,score);beep(100,.4,'sawtooth');showMsg()}
function build(){scene=new T.Scene();const c=new T.Color(C.k);scene.background=c;scene.fog=new T.Fog(c,30,95);scene.add(new T.HemisphereLight(0xffffff,0x445566,.9));const d=new T.DirectionalLight(0xffffff,.8);d.position.set(5,12,6);scene.add(d);
 ground=new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshLambertMaterial({color:C.g}));ground.rotation.x=-Math.PI/2;scene.add(ground)}
function reset(){score=0;t=0;lv=0;PT=[];build();M.init();M.update(0);state='ready';bs=best(gi,0);showMsg()}
function size(){const r=$('cw').getBoundingClientRect();W=r.width||1;H=r.height||1;ren.setPixelRatio(Math.min(devicePixelRatio||1,2));ren.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix()}
function pause(v){paused=v;$('pm').style.display=v?'flex':'none';if(v)keys={}}

/* ---------- RUNNER ---------- */
const MR={init(){const b=mk('b',.6,0x3b82f6),h=mk('s',.4,0xffe0bd);b.scale.y=1.4;b.position.y=.7;h.position.y=1.7;this.P=new T.Group();this.P.add(b,h);scene.add(this.P);
 this.ln=0;this.py=0;this.vy=0;this.d=0;this.co=0;this.ob=[];this.dc=[];this.nx=20;
 const p=A(new T.Mesh(new T.PlaneGeometry(10,400),new T.MeshLambertMaterial({color:new T.Color(C.g).offsetHSL(0,0,-.08)})),0,.01,-150);p.rotation.x=-Math.PI/2;
 for(let z=-98;z<12;z+=5.5)this.deco(z)},
deco(z){const s=R()<.5?-1:1,m=mk('c',1.2+R(),new T.Color(C.g).offsetHSL(0,.05,-.2));m.scale.y=1.6;A(m,s*(7+R()*12),m.geometry.parameters.height*.8,z);this.dc.push(m);
 for(const x of[-1.5,1.5]){const d=mk('b',.3,0xffffff);d.scale.set(.2,.04,5);A(d,x,.03,z);this.dc.push(d)}},
spawn(){const x=(Math.floor(R()*3)-1)*3,r=R();
 if(r<.4){const m=mk('b',.5,C.en);m.scale.set(2.2,.9,.9);this.ob.push({m:A(m,x,.4,-95),t:'l'})}
 else if(r<.8){const m=mk(C.es,.9,C.en);m.scale.y=1.8;this.ob.push({m:A(m,x,1.5,-95),t:'t'})}
 else for(let i=0;i<5;i++)this.ob.push({m:A(mk('d',.4,C.pk,1),x,1,-95-i*2.5),t:'c'})},
act(k){if(k==='l')this.ln=Math.max(-1,this.ln-1);else if(k==='r')this.ln=Math.min(1,this.ln+1);else if(k==='j'&&this.py===0){this.vy=15;beep(500,.1)}},
update(dt){const s=14+Math.min(16,this.d/90),P=this.P;this.d+=s*dt;score=Math.floor(this.d/3)+this.co*10;
 P.position.x+=(this.ln*3-P.position.x)*Math.min(1,dt*12);this.vy-=42*dt;this.py=Math.max(0,this.py+this.vy*dt);if(!this.py)this.vy=0;P.position.y=this.py;
 cam.position.set(P.position.x*.6,4.5,8);cam.lookAt(P.position.x*.6,1.5,-8);
 for(const m of this.dc){m.position.z+=s*dt;if(m.position.z>12)m.position.z-=110}
 this.nx-=s*dt;if(this.nx<=0){this.nx=Math.max(9,17-this.d/150)+R()*6;this.spawn()}
 for(const o of this.ob){o.m.position.z+=s*dt;if(o.t==='c')o.m.rotation.y+=dt*4}
 for(const o of this.ob){const m=o.m,dx=Math.abs(m.position.x-P.position.x);
  if(Math.abs(m.position.z)<.9&&dx<1.2){if(o.t==='c'){if(!o.u){o.u=1;this.co++;beep(880,.08)}}else if(o.t==='t'||this.py<.8){boom(P.position,C.en,14);end();return}}}
 this.ob=this.ob.filter(o=>{if(o.m.position.z>12||o.u){scene.remove(o.m);return false}return true})}};

/* ---------- EXPLORER ---------- */
const ME={init(){const b=mk('b',.5,0xffb300),h=mk('s',.38,0xffe0bd);b.scale.y=1.3;b.position.y=.5;h.position.y=1.35;this.P=new T.Group();this.P.add(b,h);scene.add(this.P);
 this.pk=[];this.en=[];this.inv=0;lv=3;
 for(let i=0;i<30;i++){const m=mk(R()<.5?'c':'b',.8+R()*1.2,new T.Color(C.g).offsetHSL(0,.05,-.15));let x=(R()-.5)*50,z=(R()-.5)*50;if(Math.hypot(x,z)<6)x+=10;A(m,x,m.geometry.parameters.height/2,z)}
 for(let i=0;i<6;i++)this.sp();for(let i=0;i<2;i++)this.se()},
sp(){A(this.pk[this.pk.push(mk(C.ps,.5,C.pk,1))-1],(R()-.5)*38,.9,(R()-.5)*38)},
se(){const p=this.P.position;let x,z;do{x=(R()-.5)*40;z=(R()-.5)*40}while(Math.hypot(x-p.x,z-p.z)<14);const m=A(mk(C.es,.8,C.en),x,.8,z);m.userData.sp=2.6+R();this.en.push(m)},
update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(ptr.down){dx=ptr.nx;dz=-ptr.ny;if(Math.hypot(dx,dz)<.12)dx=dz=0}
 const l=Math.hypot(dx,dz),k=l>1?1/l:1,P=this.P,p=P.position;
 p.x=cl(p.x+dx*k*9*dt,-22,22);p.z=cl(p.z+dz*k*9*dt,-22,22);if(l>.1)P.rotation.y=Math.atan2(dx,dz);
 cam.position.set(p.x,15,p.z+11);cam.lookAt(p.x,0,p.z);
 this.inv-=dt;P.visible=this.inv<=0||Math.floor(this.inv*10)%2==0;
 for(let i=this.pk.length-1;i>=0;i--){const m=this.pk[i];m.rotation.y+=dt*3;m.position.y=.9+Math.sin(t*4+m.position.x)*.2;
  if(m.position.distanceTo(p)<1.5){scene.remove(m);this.pk.splice(i,1);score+=10;beep(900,.08);this.sp();const w=Math.min(10,2+Math.floor(score/60));while(this.en.length<w)this.se()}}
 for(const e of this.en){const v=Math.min(7,e.userData.sp+score/90),a=Math.atan2(p.x-e.position.x,p.z-e.position.z);
  e.position.x+=Math.sin(a)*v*dt;e.position.z+=Math.cos(a)*v*dt;e.rotation.y+=dt*2;e.position.y=.8+Math.abs(Math.sin(t*6+v))*.3;
  if(this.inv<=0&&Math.hypot(e.position.x-p.x,e.position.z-p.z)<1.4){lv--;this.inv=1.6;boom(p,C.en,12);if(lv<=0){end();return}}}}};

/* ---------- FLIGHT ---------- */
const MF={init(){const g=new T.Group(),b=mk('b',.4,0xeeeeee),w=mk('b',.4,0xff5252),tl=mk('b',.2,0xeeeeee);b.scale.set(1,.7,3.4);w.scale.set(5,.12,1.5);tl.scale.set(.2,2,.8);tl.position.set(0,.4,1.3);g.add(b,w,tl);
 this.P=A(g,0,3,0);this.ob=[];this.dc=[];this.tx=0;this.ty=3;this.nx=15;this.rg=0;this.inv=0;lv=3;ground.position.y=-2;
 for(let z=-98;z<12;z+=4){const m=mk('c',1.5+R()*2,new T.Color(C.g).offsetHSL(0,.05,-.2));m.scale.y=2+R()*2;A(m,(R()<.5?-1:1)*(9+R()*25),-2+m.geometry.parameters.height*m.scale.y/2,z);this.dc.push(m)}},
update(dt){const s=18+Math.min(14,t*.3),P=this.P;
 const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 if(kx||ky){this.tx=cl(this.tx+kx*11*dt,-6.5,6.5);this.ty=cl(this.ty+ky*8*dt,.4,6.5)}else if(ptr.on){this.tx=ptr.nx*6.5;this.ty=cl(3.4+ptr.ny*3.2,.4,6.5)}
 const ox=P.position.x;P.position.x+=(this.tx-ox)*Math.min(1,dt*7);P.position.y+=(this.ty-P.position.y)*Math.min(1,dt*7);P.rotation.z=cl((ox-P.position.x)*4,-.7,.7);
 cam.position.set(P.position.x*.7,P.position.y*.6+2.5,9);cam.lookAt(P.position.x*.7,P.position.y*.6+.5,-12);
 this.inv-=dt;P.visible=this.inv<=0||Math.floor(this.inv*10)%2==0;score=this.rg*10+Math.floor(t);
 for(const m of this.dc){m.position.z+=s*dt;if(m.position.z>12)m.position.z-=110}
 this.nx-=s*dt;if(this.nx<=0){this.nx=11+R()*5;const rx=(R()-.5)*10,ry=1+R()*5,r=A(mk('t',1.9,C.pk,1),rx,ry,-100);r.userData={r:1};this.ob.push(r);
  for(let i=0;i<2;i++){let x,y;do{x=(R()-.5)*13;y=.6+R()*6}while(Math.hypot(x-rx,y-ry)<3.6);const o=A(mk(C.es,1.1,C.en),x,y,-100-i*5-R()*4);o.userData={r:0};this.ob.push(o)}}
 for(let i=this.ob.length-1;i>=0;i--){const m=this.ob[i],u=m.userData;m.position.z+=s*dt;if(u.r)m.rotation.z+=dt*2;else m.rotation.y+=dt;
  const z=m.position.z,d=Math.hypot(m.position.x-P.position.x,m.position.y-P.position.y);
  if(!u.h&&z>-.8&&z<1){if(u.r){u.h=1;if(d<2.3){this.rg++;beep(1000,.1);m.material.color.set(0xffffff)}else m.material.color.set(0x555555)}
   else if(d<1.7&&this.inv<=0){u.h=1;lv--;this.inv=1.5;boom(P.position,C.en,14);if(lv<=0){end();return}}}
  if(z>14){scene.remove(m);this.ob.splice(i,1)}}}};

/* ---------- SIEGE ---------- */
const MS={init(){const b=mk('b',1.4,0x9aa5b1),r=mk('c',2,0xc0392b);b.position.y=1.1;r.position.y=4.2;r.scale.set(1.2,1,1.2);scene.add(b,r);this.en=[];this.nx=1;lv=5;
 for(let i=0;i<24;i++){const a=i/24*6.28,m=mk('c',.8+R(),new T.Color(C.g).offsetHSL(0,.05,-.15));A(m,Math.cos(a)*(27+R()*8),1,Math.sin(a)*(27+R()*8))}
 cam.position.set(0,20,17);cam.lookAt(0,0,0)},
act(k){if(k!=='tap')return;ray.setFromCamera(new T.Vector2(ptr.nx,ptr.ny),cam);let bst=null,bd=9e9;
 for(const m of this.en){const d=ray.ray.distanceToPoint(m.position),c=cam.position.distanceTo(m.position);if(d<m.userData.r+1&&c<bd){bst=m;bd=c}}
 if(bst){const u=bst.userData;if(--u.hp<=0){score+=u.pt;boom(bst.position,C.en,12);scene.remove(bst);this.en.splice(this.en.indexOf(bst),1)}else boom(bst.position,0xffffff,5)}
 else{beep(200,.06);const v=new T.Vector3();if(ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),0),v))boom(v,0xffffff,3)}},
update(dt){this.nx-=dt;
 if(this.nx<=0){this.nx=Math.max(.4,1.3-score/350);const a=R()*6.283,big=score>120&&R()<.25,m=mk(C.es,big?1.3:.8,C.en);A(m,Math.cos(a)*21,big?1.3:.8,Math.sin(a)*21);m.userData={hp:big?3:1,r:big?1.5:1,sp:2.4+Math.min(3.5,score/100)+R()*.6,pt:big?30:10};this.en.push(m)}
 for(let i=this.en.length-1;i>=0;i--){const m=this.en[i],p=m.position,d=Math.hypot(p.x,p.z)||1,v=m.userData.sp*dt;p.x-=p.x/d*v;p.z-=p.z/d*v;m.rotation.y+=dt*2;p.y=(m.userData.r>1?1.3:.8)+Math.abs(Math.sin(t*7+i))*.3;
  if(d<2.6){scene.remove(m);this.en.splice(i,1);lv--;boom(new T.Vector3(0,2,0),C.en,14);if(lv<=0){end();return}}}}};
const MECH={run:MR,exp:ME,fly:MF,shoot:MS};

/* ---------- main loop & input ---------- */
function loop(ts){raf=requestAnimationFrame(loop);const dt=Math.min(.033,(ts-last)/1e3||0);last=ts;
 if(state==='play'&&!paused){t+=dt;M.update(dt)}
 const pd=paused?0:dt;for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l-=pd;p.v.y-=14*pd;p.m.position.addScaledVector(p.v,pd);p.m.scale.setScalar(Math.max(.01,p.l/.7));if(p.l<=0){scene.remove(p.m);PT.splice(i,1)}}
 ren.render(scene,cam);
 const h=`<span>Score ${score}</span><span>${lv>0?'❤️'.repeat(lv):''}</span><span>Best ${Math.max(bs,score)}</span>`;if(h!==hs){hs=h;$('hud').innerHTML=h}}
function press(){if(state==='ready'){state='play';showMsg();beep(600,.1);return true}if(state==='over'&&performance.now()-overAt>600){reset();state='play';showMsg();return true}return false}
function launch(i){gi=i;C=L[i];M=MECH[C.m];$('menu').style.display='none';$('st').style.display='flex';$('gn').textContent=C.e+' '+C.n;pause(false);size();reset();cancelAnimationFrame(raf);last=performance.now();loop(last)}
function home(){pause(false);if(document.fullscreenElement)document.exitFullscreen();cancelAnimationFrame(raf);M=null;$('st').style.display='none';$('menu').style.display='block'}
addEventListener('keydown',e=>{if(!M)return;const k=e.key.toLowerCase();keys[k]=1;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 if((k==='p'||k==='escape')&&state==='play'){pause(!paused);return}if(paused||press())return;
 if(state==='play'&&M.act)M.act(k==='arrowleft'||k==='a'?'l':k==='arrowright'||k==='d'?'r':(k===' '||k==='arrowup'||k==='w')?'j':k)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pp(e){const r=cv.getBoundingClientRect();ptr.nx=(e.clientX-r.left)/r.width*2-1;ptr.ny=1-(e.clientY-r.top)/r.height*2}
cv.addEventListener('pointerdown',e=>{pp(e);ptr.down=ptr.on=true;if(paused||press())return;if(state==='play'&&M.act)M.act(C.m==='run'?(ptr.nx<-.33?'l':ptr.nx>.33?'r':'j'):'tap')});
cv.addEventListener('pointermove',e=>{pp(e);if(e.pointerType==='mouse')ptr.on=true});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')ptr.on=false});
addEventListener('pointerup',e=>{ptr.down=false;if(e.pointerType!=='mouse')ptr.on=false});
addEventListener('resize',()=>{if(M)size()});try{new ResizeObserver(()=>{if(M)size()}).observe($('cw'))}catch(e){}
$('back').onclick=$('ex').onclick=home;$('pb').onclick=()=>{if(state==='play')pause(!paused)};$('rs').onclick=()=>pause(false);$('rt').onclick=()=>{pause(false);reset()};
$('mb').onclick=()=>{muted=!muted;$('mb').textContent=muted?'🔇':'🔊'};
$('fb').onclick=()=>{const w=$('cw');document.fullscreenElement?document.exitFullscreen():(w.requestFullscreen||w.webkitRequestFullscreen).call(w)};
</script></body></html>
