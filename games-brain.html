<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Games Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--c:#00f2fe;--bg:#05070c;--pn:#0c101a;--bd:#1e293b;--mut:#94a3b8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none}
button,select,input{font:inherit}
.b{padding:.5rem .9rem;border-radius:.7rem;border:1px solid #334155;background:var(--pn);color:#e5e7eb;font-size:.82rem;cursor:pointer;transition:.15s}
.b:hover{border-color:var(--c);transform:translateY(-1px)}
.b.on{background:var(--c);color:#05070c;font-weight:700;border-color:var(--c)}
.b:disabled{opacity:.4;pointer-events:none}
.b.big{width:100%;margin-top:14px;padding:.8rem;font-size:1rem}
.in option{background:#0c101a;color:#fff}select.in{color-scheme:dark}
.in{width:100%;padding:.65rem;border-radius:.6rem;background:var(--pn);border:1px solid #334155;color:#fff;margin-top:.5rem}
.scr{position:fixed;inset:0;z-index:30}
#login{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#13203a,#05070c)}
.lcard{width:min(340px,92vw);padding:28px;border-radius:20px;background:#0c101acc;border:1px solid var(--bd)}
#menu{display:none;flex-direction:column;background:radial-gradient(ellipse at 30% 0,#10233f,#05070c 60%)}
.mtop{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--bd)}
.logo{font-weight:900;letter-spacing:.12em;color:var(--c);font-size:18px}
.sp{flex:1}
.mwrap{flex:1;display:flex;min-height:0}
.mmain{flex:1;overflow:auto;padding:20px}
.mmain h2{margin:0 0 14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.gc{padding:20px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 22%,#0c101a),#0c101a 70%);border:1px solid color-mix(in srgb,var(--g) 45%,#1e293b);cursor:pointer;transition:.2s}
.gc:hover{transform:translateY(-4px);box-shadow:0 10px 30px color-mix(in srgb,var(--g) 30%,transparent)}
.ge{font-size:44px}.gc h3{margin:8px 0 4px}.gc p{margin:0 0 12px;font-size:12px;color:var(--mut);min-height:48px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:11px;padding:3px 8px;border-radius:99px;background:#ffffff14}
.side{width:300px;overflow:auto;padding:16px;background:#0a0d16cc;border-left:1px solid var(--bd)}
.side h3,.sl{font-size:11px;letter-spacing:.15em;color:var(--mut);margin:16px 0 8px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:6px 9px;border-radius:8px;background:#0f1422;margin-bottom:4px}
.me{outline:1px solid var(--c)}.mut{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:6px;background:var(--bd);margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00f2fe,#7f00ff)}
#portal{display:none;z-index:40;align-items:center;justify-content:center;background:#000a}
.modal{width:min(720px,94vw);max-height:92vh;max-height:92dvh;overflow:auto;padding:22px;border-radius:20px;background:var(--pn);border:1px solid #334155}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}.mt{font-size:24px;font-weight:800}.ms{font-size:12px;color:var(--mut)}
.sg{margin-top:12px}.so{display:flex;gap:6px;flex-wrap:wrap}.sg .sl{margin:0 0 6px}
.box{margin-top:12px;padding:12px;border-radius:12px;border:1px dashed #334155}.code{font-size:22px;letter-spacing:.2em;color:#fbbf24;margin-left:8px}
#game{display:none;position:fixed;inset:0;z-index:20}
#cv{position:absolute;inset:0;touch-action:none}
#gbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:5}
#gtitle{font-weight:800;margin:0 8px}
#ptop{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.pc{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#0c101acc;border:1px solid var(--bd);font-size:13px}
.pc.act{border-color:var(--pc);box-shadow:0 0 16px color-mix(in srgb,var(--pc) 55%,transparent)}
.pc small{display:block;color:var(--mut);font-size:10px}.dot{width:12px;height:12px;border-radius:50%;background:var(--pc)}
.ck{font-family:ui-monospace,monospace;font-size:18px;font-weight:800;margin-left:6px}
#gstat{position:absolute;left:12px;bottom:12px;z-index:5;padding:12px 16px;border-radius:14px;background:#0c101acc;border:1px solid var(--bd);max-width:420px}
#status{color:var(--c);font-weight:600;margin-bottom:8px;font-size:14px}#acts{display:flex;gap:6px;flex-wrap:wrap}
#gside{position:absolute;top:0;right:0;bottom:0;width:280px;overflow:auto;padding:14px;background:#0a0d16d9;border-left:1px solid var(--bd);z-index:4}
#gside.hid{display:none}
#res{display:none;position:absolute;inset:0;z-index:8;background:#0008;align-items:center;justify-content:center}
.rb{margin:12vh auto 0;width:min(380px,92vw);text-align:center;padding:26px;border-radius:20px;background:var(--pn);border:1px solid var(--c)}
.rb h2{margin:0 0 6px;font-size:28px}.rb .xp{color:#fbbf24;font-weight:800;font-size:20px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:none;padding:10px 18px;border-radius:12px;background:#0c101af0;border:1px solid var(--c);font-weight:600}
@media(max-width:800px){.mwrap{flex-direction:column;overflow:auto}.mmain{flex:none;overflow:visible}.side{display:block;width:auto;flex:none;border-left:0;border-top:1px solid var(--bd)}#gside{top:auto;left:0;right:0;width:auto;max-height:34vh;max-height:34dvh;border-left:0;border-top:1px solid var(--bd)}body:has(#gside:not(.hid)) #gstat{bottom:calc(34dvh + 8px)}#gstat{max-width:calc(100vw - 24px)}#ptop{flex-wrap:wrap;justify-content:center;width:96vw}#gbar{max-width:calc(100vw - 20px)}}
</style><style id="ff-mobile">
/* Familyforge mobile fixes */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;overflow-x:clip}
button,a,[role=button],input,select,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:820px){input,select,textarea{font-size:16px}} /* stops iOS zoom-on-focus */
</style>
</head><body>

<div id="login" class="scr">
 <div class="lcard">
  <h1 style="font-size:22px;font-weight:800;margin:0 0 4px;color:#00f2fe">3D GAMES ARENA</h1>
  <p style="font-size:12px;color:#94a3b8;margin:0 0 14px">Sign in to track your level, records and rank.</p>
  <div style="display:flex;gap:8px"><button class="b on" id="tNew" onclick="setTab('new')">New user</button><button class="b" id="tOld" onclick="setTab('old')">Existing user</button></div>
  <input id="uName" class="in" placeholder="Username" maxlength="16" autocomplete="username">
  <input id="uPass" class="in" type="password" placeholder="Password" autocomplete="current-password">
  <select id="uCountry" class="in"></select>
  <div id="err" style="color:#f87171;font-size:12px;min-height:16px;margin-top:8px"></div>
  <button class="b on" style="width:100%;margin-top:6px" onclick="submitLogin()">Continue</button>
 </div>
</div>

<div id="menu" class="scr">
 <div class="mtop"><div class="logo">3D GAMES ARENA</div><div class="sp"></div>
  <button class="b" onclick="togMute()">🔊</button><button class="b" onclick="fs()">⛶ Full screen</button><button class="b" onclick="logout()">Log out</button></div>
 <div class="mwrap"><div class="mmain"><h2>Choose a game</h2><div id="grid"></div></div><aside class="side" id="mside"></aside></div>
</div>

<div id="portal" class="scr"><div class="modal" id="pbox"></div></div>

<div id="game">
 <div id="cv"></div>
 <div id="gbar"><button class="b" onclick="exitGame()">← Menu</button><span id="gtitle"></span><button class="b" onclick="fs()">⛶ Full screen</button><button class="b" onclick="togSide()">☰ Panel</button><button class="b" onclick="togMute()">🔊</button></div>
 <div id="ptop"></div>
 <div id="gstat"><div id="status"></div><div id="acts"></div></div>
 <aside id="gside"></aside>
 <div id="res"></div>
</div>
<div id="toast"></div>

<script>
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const flag=c=>[...(c||'')].map(x=>String.fromCodePoint(127397+x.charCodeAt(0))).join('');
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const CN="AE:United Arab Emirates,US:United States,GB:United Kingdom,CA:Canada,AU:Australia,IN:India,PK:Pakistan,PH:Philippines,NG:Nigeria,ZA:South Africa,EG:Egypt,SA:Saudi Arabia,TR:Turkey,DE:Germany,FR:France,ES:Spain,IT:Italy,BR:Brazil,MX:Mexico,AR:Argentina,CN:China,JP:Japan,KR:South Korea,ID:Indonesia,RU:Russia,KE:Kenya,GH:Ghana,NZ:New Zealand,IE:Ireland,NL:Netherlands,SE:Sweden,NO:Norway,PL:Poland,UA:Ukraine,BD:Bangladesh,LK:Sri Lanka,NP:Nepal,MY:Malaysia,SG:Singapore,TH:Thailand,VN:Vietnam,QA:Qatar,KW:Kuwait,OM:Oman,BH:Bahrain,JO:Jordan,LB:Lebanon,MA:Morocco,DZ:Algeria,CO:Colombia,CL:Chile,PE:Peru".split(',').map(s=>s.split(':'));
$('uCountry').innerHTML='<option value="">Country…</option>'+CN.map(([c,n])=>`<option value="${c}">${flag(c)} ${n}</option>`).join('');
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
function fs(){const d=document;if(!d.fullscreenElement){const p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>toast('Full screen was blocked by the browser'))}else d.exitFullscreen()}
let AC=null,mute=false;
function snd(f=440,d=.08,t='sine',v=.1,f2){if(mute)return;try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function togMute(){mute=!mute;toast(mute?'Sound off':'Sound on')}

/* ================= accounts ================= */
let mem={},user=null,tab='new';
const db=()=>{try{const s=localStorage.getItem('arena_db');return s?JSON.parse(s):mem}catch(e){return mem}};
const sv=d=>{mem=d;try{localStorage.setItem('arena_db',JSON.stringify(d))}catch(e){}};
async function H(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('arena:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return''+h}}
const err=m=>$('err').textContent=m;
function setTab(t){tab=t;$('uCountry').style.display=t==='new'?'block':'none';$('tNew').className='b'+(t==='new'?' on':'');$('tOld').className='b'+(t==='old'?' on':'');err('')}
async function submitLogin(){
 const u=$('uName').value.trim(),p=$('uPass').value,d=db(),k=u.toLowerCase();
 if(!/^[A-Za-z0-9_]{3,16}$/.test(u))return err('Username: 3-16 letters, numbers or _');
 if(p.length<4)return err('Password needs at least 4 characters');
 if(tab==='new'){
  if(d[k])return err('That username is taken');
  if(!$('uCountry').value)return err('Please choose your country');
  d[k]={name:u,hash:await H(p),country:$('uCountry').value,xp:0,stats:{}};sv(d);
 }else if(!d[k]||d[k].hash!==await H(p))return err('Wrong username or password');
 try{localStorage.setItem('arena_sess',k)}catch(e){}
 enter(k);
}
function logout(){try{localStorage.removeItem('arena_sess')}catch(e){}location.reload()}
setTab('new');
const st=(u,g)=>{const s=u.stats[g]||(u.stats[g]={});for(const k of['w','l','d','xp'])s[k]=s[k]||0;if(s.best===undefined)s.best=null;return s};
const lvl=xp=>Math.floor(Math.sqrt(xp/40))+1,lo=L=>40*(L-1)**2;
const TITLES=['Rookie','Challenger','Tactician','Expert','Master','Grandmaster'];
function prof(){
 const u=db()[user],L=lvl(u.xp),a=lo(L),b=lo(L+1),pc=Math.round((u.xp-a)/(b-a)*100);
 return `<div style="font-size:18px;font-weight:800">${flag(u.country)} ${esc(u.name)}</div>
 <div style="color:#fbbf24;font-size:13px;font-weight:700;margin-top:2px">Level ${L} · ${TITLES[Math.min(5,Math.floor((L-1)/3))]}</div>
 <div class="bar"><i style="width:${pc}%"></i></div><div class="mut">${u.xp} XP · ${b-u.xp} to Level ${L+1}</div>`;
}
function lb(g,n=8){
 const d=db(),meName=d[user]&&d[user].name;
 const rows=Object.values(d).map(u=>({u,s:u.stats[g]||{}})).filter(r=>(r.s.w||0)+(r.s.l||0)+(r.s.d||0)>0)
  .sort((a,b)=>(b.s.xp||0)-(a.s.xp||0)||(b.s.w||0)-(a.s.w||0)).slice(0,n);
 return rows.length?rows.map((r,i)=>`<div class="row ${r.u.name===meName?'me':''}"><span>${i+1}. ${flag(r.u.country)} ${esc(r.u.name)}</span><span>${r.s.w||0}W · ${r.s.xp||0} XP · Lv ${lvl(r.u.xp)}</span></div>`).join(''):'<div class="mut">No games played yet. Be the first!</div>';
}

/* ================= game list ================= */
const GM={
 chess:{n:'Chess',e:'♞',c:'#00f2fe',d:'Castling, en passant, real clocks, pause and resign.',min:2,max:2,o:{t:10,inc:0}},
 ttt:{n:'Tic-Tac-Toe',e:'❌',c:'#ff3d8b',d:'Neon 3D board with Classic, Big 5×5 and Misère modes.',min:2,max:2,o:{v:'classic'}},
 c4:{n:'Connect Four',e:'🔴',c:'#3b82f6',d:'Drop discs into a glossy 3D board. Get four in a row!',min:2,max:2,o:{}},
 reversi:{n:'Reversi',e:'⚫',c:'#22c55e',d:'Flip your opponent\'s discs. Easy to learn, hard to master.',min:2,max:2,o:{},high:1},
 snakes:{n:'Snakes & Ladders',e:'🐍',c:'#fbbf24',d:'3D board, real dice, 2–4 players. A 6 gives another roll.',min:2,max:4,o:{}},
 ludo:{n:'Ludo',e:'🎲',c:'#ef4444',d:'Full rules: captures, safe stars, home column. 2–4 players.',min:2,max:4,o:{}}
};
function enter(k){user=k;showMenu()}
const hideAll=()=>['login','menu','portal','game'].forEach(i=>$(i).style.display='none');
function showMenu(){hideAll();$('menu').style.display='flex';renderMenu()}
function olHTML(){const ps=Object.values(NET.peers);return ps.length?ps.map(p=>`<div class="row"><span>🟢 ${flag(p.c)} ${esc(p.n)}</span><span>${p.g&&GM[p.g]?GM[p.g].n:'In menu'}</span></div>`).join(''):'<div class="mut">No one else online right now.</div>'}
function renderMenu(){
 const u=db()[user];
 $('grid').innerHTML=Object.entries(GM).map(([k,g])=>{const s=st(u,k);return `<div class="gc" style="--g:${g.c}" onclick="openPortal('${k}')"><div class="ge">${g.e}</div><h3>${g.n}</h3><p>${g.d}</p><div class="tags"><span>${g.min===g.max?g.max+' players':g.min+'–'+g.max+' players'}</span><span>${s.w}W ${s.l}L ${s.d}D</span></div></div>`}).join('');
 $('mside').innerHTML=prof()+'<h3>Players online</h3><div class="olist">'+olHTML()+'</div><h3>Your records</h3>'+Object.entries(GM).map(([k,g])=>{const s=st(u,k);return `<div class="row"><span>${g.e} ${g.n}</span><span>${s.w}W ${s.l}L ${s.d}D · ${s.xp} XP</span></div>`}).join('');
}

/* ================= online layer (BroadcastChannel) ================= */
const NET={id:Math.random().toString(36).slice(2,9),ch:null,peers:{},rooms:{},sig:'',
 init(){try{this.ch=new BroadcastChannel('arena_v2');this.ch.onmessage=e=>this.recv(e.data)}catch(e){}setInterval(()=>this.tick(),2000);this.tick()},
 send(o){o.from=this.id;try{this.ch&&this.ch.postMessage(o)}catch(e){}},
 tick(){
  const now=Date.now();
  for(const k in this.peers)if(now-this.peers[k].t>7000)delete this.peers[k];
  for(const k in this.rooms)if(now-this.rooms[k].t>7000)delete this.rooms[k];
  if(user&&db()[user]){const u=db()[user];this.send({k:'hi',n:u.name,c:u.country,g:S?S.g:''});
   if(P&&P.mode==='online'&&P.role==='host'&&P.room&&$('portal').style.display!=='none')this.send({k:'room',room:P.room,g:P.g,h:u.name,c:u.country,need:needN(),have:P.lobby.length})}
  document.querySelectorAll('.olist').forEach(e=>e.innerHTML=olHTML());
  const sg=Object.keys(this.rooms).join()+Object.keys(this.peers).length;
  if(sg!==this.sig){this.sig=sg;if(P&&$('portal').style.display!=='none'&&P.mode==='online')renderPortal()}
 },
 recv(m){
  if(!m||m.from===this.id)return;
  if(m.k==='hi')this.peers[m.from]={n:m.n,c:m.c,g:m.g,t:Date.now()};
  else if(m.k==='room')this.rooms[m.from]={...m,t:Date.now()};
  else if(m.k==='join'&&P&&P.role==='host'&&P.mode==='online'&&P.room===m.room&&!P.lobby.some(x=>x.id===m.from)&&P.lobby.length<needN()){
   P.lobby.push({id:m.from,n:m.n,c:m.c});this.send({k:'lobby',room:P.room,l:P.lobby.map(x=>({n:x.n,c:x.c})),need:needN()});renderPortal()}
  else if(m.k==='lobby'&&P&&P.joined===m.room){P.lobbyInfo=m;renderPortal()}
  else if(m.k==='start'&&P&&P.joined===m.room){
   const seats=m.seats.map(s=>({n:s.n,c:s.c,id:s.id,kind:s.id===this.id?'me':'remote'}));
   if(!seats.some(s=>s.kind==='me'))return;
   const cfg={g:m.g,mode:'online',diff:m.diff,o:m.o,seats,online:true,room:m.room};$('portal').style.display='none';P=null;begin(cfg)}
  else if(S&&S.online&&m.room===S.room){
   if(m.k==='mv'){S.q.push(m.m);drain()}
   else if(m.k==='ctl'){if(m.t==='pause'){S.paused=m.v;pauseUI();if(!m.v)kick()}else if(m.t==='resign')doResign(m.seat)}
   else if(m.k==='leave'&&!over){toast('Opponent left the game');finish(S.me,'Opponent left the game')}}
 }};

/* ================= setup portal ================= */
let P=null;
function openPortal(g){P={g,mode:'ai',diff:2,n:GM[g].min,role:'host',st:[],o:{...GM[g].o},room:null,lobby:[],joined:null,lobbyInfo:null};$('portal').style.display='flex';renderPortal()}
function closePortal(){if(P&&P.joined)NET.send({k:'leave',room:P.joined});P=null;$('portal').style.display='none'}
const needN=()=>{if(!P)return 0;const n=GM[P.g].max>2?P.n:2;let c=0;for(let i=1;i<n;i++)if((P.st[i]||'online')==='online')c++;return c};
function mkRoom(){P.room=Math.random().toString(36).slice(2,6).toUpperCase();P.lobby=[]}
function setP(k,v){
 if(k==='mode'){P.mode=v;P.joined=null;if(v==='online'&&P.role==='host')mkRoom();else if(v!=='online')P.room=null}
 else if(k==='role'){P.role=v;P.joined=null;P.lobbyInfo=null;if(v==='host')mkRoom();else P.room=null}
 else if(k==='n'){P.n=v;P.lobby=P.lobby.slice(0,needN())}
 else if(k.startsWith('o.'))P.o[k.slice(2)]=v;
 else if(k.startsWith('st:')){P.st[+k.slice(3)]=v;P.lobby=P.lobby.slice(0,needN())}
 else P[k]=v;
 renderPortal();
}
function joinRoom(from,room){const u=db()[user];P.joined=room;NET.send({k:'join',room,n:u.name,c:u.country});renderPortal()}
const seg=(lb,opts,cur,key)=>`<div class="sg"><div class="sl">${lb}</div><div class="so">${opts.map(([v,t])=>`<button class="b ${v===cur?'on':''}" onclick='setP(${JSON.stringify(key)},${JSON.stringify(v)})'>${t}</button>`).join('')}</div></div>`;
function onlineBox(){
 const g=GM[P.g];let h=seg('Online role',[['host','Host a room'],['join','Join a room']],P.role,'role');
 if(P.role==='host'){
  h+=`<div class="box">Room code <b class="code">${P.room}</b><div class="mut">Your room now appears in "Join a room" for other players.</div>`;
  if(g.max>2)for(let i=1;i<P.n;i++)h+=seg('Seat '+(i+1),[['online','Human (online)'],['ai','AI bot']],P.st[i]||'online','st:'+i);

 if(cap){ex=true;boom(p.m.position.clone());snd(150,.3,'sawtooth',.14,50);hud(`${pn(s)} captures a pawn!`)}
 if(p.rel===56){ex=true;snd(700,.3,'triangle',.12,1200);boom(p.m.position.clone());hud(`${pn(s)} gets a pawn home!`)}
 if(LP.filter(o=>o.s===s&&o.rel===56).length===4){finish(s,`${pn(s)} brings all four pawns home!`,rolls[s]);return}
 later(cap?720:160,()=>{lLayout();lNext(ex)});
}
function lNext(extra){
 if(over||!S)return;ph='roll';LLEG=[];lHide();
 if(!extra){S.turn=(S.turn+1)%S.seats.length;L6=0}
 cards();hud(`${pn(S.turn)} (${LNAME[LCI(S.turn)]}) – ${extra?'roll again':'roll the dice'}`);free();
}
function lAI(){
 if(ph==='roll'){play({r:1+Math.floor(Math.random()*6)});return}
 let bs=-1e9,b=LLEG[0];
 for(const id of LLEG){const p=LP[id],c=LCI(p.s),to=p.rel<0?0:p.rel+LR;let v=Math.random()*(S.diff===1?60:2);
  if(S.diff>1){if(to===56)v+=60;if(p.rel<0)v+=40;
   if(to<=50){const idx=(LS[c]+to)%52,safe=LSAFE.includes(idx);
    if(!safe&&LP.some(o=>o.s!==p.s&&o.rel>=0&&o.rel<=50&&(LS[LCI(o.s)]+o.rel)%52===idx))v+=80;
    if(safe)v+=15;
    if(S.diff===3&&!safe&&LP.some(o=>{if(o.s===p.s||o.rel<0||o.rel>50)return false;const d=(idx-(LS[LCI(o.s)]+o.rel)%52+52)%52;return d>0&&d<=6}))v-=25}
   else v+=20;v+=to*.5}
  if(v>bs){bs=v;b=id}}
 play({p:b});
}
function lEx(){return S.seats.map((_,i)=>LP.filter(p=>p.s===i&&p.rel===56).length+'/4')}

IMPL.c4={start:c4Start,apply:c4Apply,ai:c4AI};
IMPL.reversi={start:rStart,apply:rApply,ai:rAI,ex:rEx};
IMPL.snakes={start:sStart,apply:sApply,ai:sAI,ex:sEx};
IMPL.ludo={start:lStart,apply:lApply,ai:lAI,ex:lEx};
