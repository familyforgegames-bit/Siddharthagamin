<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Educational Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080b11;color:#f3f4f6;font-family:'Segoe UI',system-ui,sans-serif}
#menu{padding:20px;max-width:1100px;margin:auto}h1{font-size:26px;margin:0 0 4px}p.s{color:#9ca3af;margin:0 0 20px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{border:1px solid #1f2937;border-radius:18px;overflow:hidden;background:#121824;cursor:pointer;text-align:left;color:inherit;padding:0;transition:transform .15s,border-color .15s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:#00f2fe;outline:none}
.th{height:130px;display:flex;align-items:center;justify-content:center;font-size:56px}.tx{padding:12px 14px}.tx b{display:block;font-size:15px}.tx span{font-size:12px;color:#9ca3af}
#stage{display:none;height:100%;flex-direction:column}
#bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0a0d14;border-bottom:1px solid #1f2937}
#bar button{background:#1f2937;color:#fff;border:0;padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer}
#cvw{flex:1;min-height:0;position:relative}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#000}

#lay{flex:1;min-height:0;display:flex;gap:14px;padding:12px 14px}
#pl{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#0a0d14;border:1px solid #1f2937}
#pl:fullscreen,#pl:-webkit-full-screen{background:#000;border:0;border-radius:0}
#pl.pfs{position:fixed;inset:0;z-index:9999;border-radius:0;background:#000}
/* Clean fullscreen: hide all chrome */
body.fs-on #bar,body.fs-on #side,body.fs-on #tb{display:none!important}
body.fs-on #lay{padding:0;gap:0}
body.fs-on #pl{border:0;border-radius:0;flex:1}
body.fs-on #cvw{border-radius:0}
/* Floating controls only in fullscreen – auto-hide */
#fsHud{display:none;position:absolute;top:12px;right:12px;z-index:20;gap:8px}
body.fs-on #fsHud{display:flex}
#fsHud button{background:rgba(15,23,42,.75);color:#fff;border:1px solid rgba(255,255,255,.15);padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
#fsHud button:hover{background:rgba(30,41,59,.9)}
#tb{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0a0d14;border-top:1px solid #1f2937}#tb b{font-size:15px}.sp{flex:1}
#tb button,.pn button{background:#1f2937;color:#fff;border:0;padding:8px 12px;border-radius:10px;font-size:14px;cursor:pointer}#tb button:hover,.pn button:hover{background:#334155}#tb u{text-decoration:none;font-size:12px}
#pm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,14,.8);backdrop-filter:blur(4px);z-index:5}
.pn{width:min(340px,90%);background:#121824;border:1px solid #2a3446;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}.pn h2{margin:0;text-align:center;color:#00f2fe}
.pn label{display:flex;flex-direction:column;gap:6px;font-size:14px}.pn label.ck{flex-direction:row;align-items:center;gap:8px}.pn input[type=range]{width:100%;accent-color:#00f2fe}
.bt{display:flex;gap:8px;flex-wrap:wrap}.bt button{flex:1}.pn .pri{background:#00a8b5;font-weight:700}
#side{width:300px;overflow-y:auto;flex:none}#side h3{margin:0 0 10px;font-size:16px}#sl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:0;overflow:hidden;background:#121824;border:1px solid #1f2937;border-radius:14px;color:inherit;cursor:pointer;text-align:left}.st:hover{border-color:#00f2fe}
.se{display:flex;height:76px;align-items:center;justify-content:center;font-size:36px}.st b,.st i{display:block;padding:0 8px}.st b{font-size:13px;padding-top:6px}.st i{font-style:normal;font-size:11px;color:#9ca3af;padding-bottom:7px}
@media(max-width:820px){#lay{flex-direction:column;overflow-y:auto}#pl{flex:none;height:64vh}#side{width:auto;overflow:visible}#tb u{display:none}}
</style></head><body>
<div id="menu"><h1>Educational Games</h1><p class="s">Learn while you play. Best scores are saved on this device.</p><div class="grid" id="grid"></div></div>
<div id="stage"><div id="bar"><button id="back">&larr; All games</button></div>
<div id="lay"><div id="pl"><div id="cvw"><canvas id="cv"></canvas>
<div id="pm"><div class="pn"><h2>Paused</h2>
<label>🎵 Music<input type="range" id="vm" min="0" max="100"></label>
<label>🔊 Sound effects<input type="range" id="vs" min="0" max="100"></label>
<label class="ck"><input type="checkbox" id="mu"> Mute all sound</label>
<div class="bt"><button id="rs" class="pri">▶ Resume</button><button id="rt">Restart</button><button id="ex">All games</button></div></div></div>
<div id="fsHud">
 <button id="fsPause" title="Pause (P)">⏸</button>
 <button id="fsMute" title="Mute">🔊</button>
 <button id="fsExit" title="Exit full screen (Esc)">✕ Exit</button>
</div>
</div>
<div id="tb"><b id="gn"></b><span class="sp"></span><button id="pb" title="Pause / Settings (P)">⏸ <u>Pause</u></button><button id="mb" title="Mute / unmute">🔊</button><button id="fb" title="Full screen">⛶ <u>Full screen</u></button></div></div>
<div id="side"><h3>Play next</h3><div id="sl"></div></div></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d'),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),R=Math.random;
/* To add a game: add a line here and a G.yourid={init,update,draw} block below. */
const LIST=[
 {id:'math',name:'Math Blaster',desc:'Shoot the correct answer',e:'🧮',bg:'linear-gradient(135deg,#1e3a8a,#3b82f6)',help:'Move with mouse/finger or arrows. Auto-fires at answer bubbles. Hit the correct one!'},
 {id:'abc',name:'Letter Catch',desc:'Catch letters A to Z',e:'🔤',bg:'linear-gradient(135deg,#7c2d12,#f59e0b)',help:'Move left/right. Catch the next letter in order. Avoid wrong ones!'},
 {id:'mem',name:'Memory Match',desc:'Find the matching pairs',e:'🧠',bg:'linear-gradient(135deg,#4c1d95,#a855f7)',help:'Tap two cards to flip. Match all pairs. Fewer moves = higher score.'},
 {id:'seq',name:'Number Sequence',desc:'Collect numbers in order',e:'🔢',bg:'linear-gradient(135deg,#065f46,#10b981)',help:'Move and collect the next number (1,2,3...). Wrong numbers cost a life.'},
 {id:'spell',name:'Word Builder',desc:'Build the word letter by letter',e:'📝',bg:'linear-gradient(135deg,#9d174d,#ec4899)',help:'Tap the correct next letter. Finish the word to score!'},
 {id:'shape',name:'Shape Sorter',desc:'Match shapes to their slots',e:'🔷',bg:'linear-gradient(135deg,#0e7490,#06b6d4)',help:'Tap a shape then the matching slot. Clear the board!'},
 {id:'count',name:'Counting Zoo',desc:'Count the animals correctly',e:'🦁',bg:'linear-gradient(135deg,#854d0e,#eab308)',help:'Count the animals, then tap the correct number.'},
 {id:'planet',name:'Planet Hopper',desc:'Jump to the right planet',e:'🪐',bg:'linear-gradient(135deg,#1e1b4b,#6366f1)',help:'Tap the correct planet when asked. Learn the solar system!'},
 {id:'color',name:'Color Mixer',desc:'Mix primary colors',e:'🎨',bg:'linear-gradient(135deg,#be185d,#f472b6)',help:'Tap two colors to mix. Match the target color!'},
 {id:'clock',name:'Clock Master',desc:'Read and set the time',e:'⏰',bg:'linear-gradient(135deg,#1e40af,#60a5fa)',help:'Tap the clock face that shows the correct time.'},
 {id:'frac',name:'Fraction Pizza',desc:'Choose the right slice',e:'🍕',bg:'linear-gradient(135deg,#9a3412,#fb923c)',help:'Tap the pizza that matches the fraction shown.'},
 {id:'flag',name:'Flag Quest',desc:'Identify world flags',e:'🏳️',bg:'linear-gradient(135deg,#0f766e,#2dd4bf)',help:'Tap the correct flag for the country name.'}
];
$('grid').innerHTML=LIST.map((g,i)=>`<button class="tile" onclick="launch(${i})"><div class="th" style="background:${g.bg}">${g.e}</div><div class="tx"><b>${g.name}</b><span>${g.desc}</span></div></button>`).join('');
let W,H,dpr=1,g,gi,state='ready',score=0,bs=0,t=0,shake=0,parts=[],keys={},ptr={x:0,y:0,down:false,on:false},raf,last=0,overAt=0;const G={};
function size(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr}
function best(n,v){try{const k='forge_edu_'+n,b=+localStorage.getItem(k)||0;if(v>b){localStorage.setItem(k,v);return v}return b}catch(e){return v}}
function boom(x,y,col,n){sfx(n>=14?'boom':'hit');for(let i=0;i<n;i++){const a=R()*6.3,s=40+R()*220;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+R()*.5,c:col,r:1+R()*3})}}
function end(){sfx('over');state='over';overAt=performance.now();shake=14;bs=best(LIST[gi].id,score)}
function reset(){score=0;t=0;shake=0;parts=[];state='ready';bs=best(LIST[gi].id,0);g.init()}
function launch(i){aInit();mStart(i);pause(false);side(i);gi=i;g=G[LIST[i].id];$('menu').style.display='none';$('stage').style.display='flex';$('gn').textContent=LIST[i].name;size();reset();cancelAnimationFrame(raf);last=performance.now();loop(last)}
$('back').onclick=()=>{mStop();pause(false);if(isFs()){if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);$('pl').classList.remove('pfs');setFsUi(false)}cancelAnimationFrame(raf);g=null;$('stage').style.display='none';$('menu').style.display='block'};
addEventListener('resize',()=>{if(g)size()});try{new ResizeObserver(()=>{if(g)size()}).observe($('cvw'))}catch(e){}
function press(){if(state==='ready'){state='play';sfx('start');return true}if(state==='over'&&performance.now()-overAt>600){reset();state='play';return true}return false}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();keys[k]=1;if(!g)return;
 if(k==='escape'&&isFs()){e.preventDefault();fs();return}
 if((k==='p'||k==='escape')&&state==='play'){pause(!paused);return}if(paused)return;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(press())return;if(state==='play'&&g.act){g.act(k);sfx('act')}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pp(e){const r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top}
cv.addEventListener('pointerdown',e=>{pp(e);ptr.down=ptr.on=true;if(press())return;if(state==='play'&&g.act){g.act('tap',ptr.x/W);sfx('act')}});
cv.addEventListener('pointermove',e=>{pp(e);if(e.pointerType==='mouse')ptr.on=true});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')ptr.on=false});
addEventListener('pointerup',e=>{ptr.down=false;if(e.pointerType!=='mouse')ptr.on=false});
function txt(s,x,y,sz,col,al){c.font='bold '+sz+'px Orbitron,Segoe UI,sans-serif';c.textAlign=al||'center';c.fillStyle=col||'#fff';c.fillText(s,x,y,W-24)}
function hud(){txt('Score '+score,16,30,18,'#fff','left');txt('Best '+Math.max(bs,score),W-16,30,14,'#9ca3af','right');
 if(state!=='play'){c.fillStyle='rgba(0,0,0,.6)';c.fillRect(0,0,W,H);
  if(state==='ready'){txt(LIST[gi].name,W/2,H/2-40,34,'#00f2fe');txt(LIST[gi].help,W/2,H/2,15,'#e5e7eb');txt('Tap or press Space to start',W/2,H/2+40,16,'#fbbf24')}
  else{txt('Game over',W/2,H/2-40,36,'#ff007f');txt('Score '+score+'   Best '+bs,W/2,H/2,18);txt('Tap or press Space to play again',W/2,H/2+40,16,'#fbbf24')}}}
function loop(ts){raf=requestAnimationFrame(loop);if(!g)return;const dt=Math.min(.033,(ts-last)/1e3||0);last=ts;
 const pd=paused?0:dt;if(state==='play'&&!paused){t+=dt;g.update(dt)}
 parts.forEach(p=>{p.x+=p.vx*pd;p.y+=p.vy*pd;p.l-=pd});parts=parts.filter(p=>p.l>0);shake=Math.max(0,shake-pd*30);
 c.setTransform(dpr,0,0,dpr,0,0);c.save();if(shake)c.translate((R()-.5)*shake,(R()-.5)*shake);
 g.draw();
 parts.forEach(p=>{c.globalAlpha=Math.min(1,p.l*1.6);c.fillStyle=p.c;c.shadowColor=p.c;c.shadowBlur=8;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill()});
 c.restore();c.globalAlpha=1;hud()}

/* ---------- player: pause menu, fullscreen, sidebar, sound ---------- */
let paused=false;
function pause(v){paused=v;$('pm').style.display=v?'flex':'none';$('pb').firstChild.textContent=v?'▶ ':'⏸ ';if(v)keys={}}
function side(cur){$('sl').innerHTML=LIST.map((g,i)=>i==cur?'':`<button class="st" onclick="launch(${i})"><span class="se" style="background:${g.bg}">${g.e}</span><b>${g.name}</b><i>${g.desc}</i></button>`).join('')}
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement||$('pl').classList.contains('pfs'))}
function setFsUi(on){
 document.body.classList.toggle('fs-on',on);
 $('fb').innerHTML=on?'⛶ <u>Exit</u>':'⛶ <u>Full screen</u>';
 if($('fsMute'))$('fsMute').textContent=AU.v.mute?'🔇':'🔊';
 setTimeout(()=>g&&size(),80);
}
function fs(){
 const e=$('pl'),d=document,on=isFs(),rq=e.requestFullscreen||e.webkitRequestFullscreen;
 if(on){
  if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
  e.classList.remove('pfs');setFsUi(false);
 }else{
  // Prefer true Fullscreen API on the whole stage area
  const target=$('stage')||e;
  const req=target.requestFullscreen||target.webkitRequestFullscreen||rq;
  if(req){
   const p=req.call(target);
   if(p&&p.catch)p.catch(()=>{e.classList.add('pfs');setFsUi(true)});
  }else{e.classList.add('pfs');setFsUi(true)}
  setTimeout(()=>setFsUi(true),100);
 }
}
// Keep UI in sync when user presses Esc or browser exits fullscreen
document.addEventListener('fullscreenchange',()=>setFsUi(!!document.fullscreenElement));
document.addEventListener('webkitfullscreenchange',()=>setFsUi(!!document.webkitFullscreenElement));
const AU={c:null,v:{m:.5,s:.7,mute:false},st:0,nx:0,tm:0,root:220,tp:0},BARS=[0,-4,-2,-5],SC=[0,3,5,7,10,12,15,12,10,7,5,3];
try{Object.assign(AU.v,JSON.parse(localStorage.getItem('forge_audio')))}catch(e){}
function aInit(){try{if(!AU.c){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;AU.c=new C();AU.mg=AU.c.createGain();AU.sg=AU.c.createGain();AU.mg.connect(AU.c.destination);AU.sg.connect(AU.c.destination);
 const b=AU.c.createBuffer(1,AU.c.sampleRate*.5,AU.c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;AU.nz=b;aApply()}
 if(AU.c.state==='suspended')AU.c.resume();return true}catch(e){AU.c=null;return false}}
function aApply(){if(AU.c){AU.mg.gain.value=AU.v.mute?0:AU.v.m*.3;AU.sg.gain.value=AU.v.mute?0:AU.v.s}try{localStorage.setItem('forge_audio',JSON.stringify(AU.v))}catch(e){}}
function tone(f,d,ty,v,dest,at,f2){const x=AU.c,o=x.createOscillator(),gn=x.createGain();at=at||x.currentTime;o.type=ty;o.frequency.setValueAtTime(f,at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+d);gn.gain.setValueAtTime(v,at);gn.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(gn);gn.connect(dest);o.start(at);o.stop(at+d+.02)}
function noise(d,v,fr){const x=AU.c,s=x.createBufferSource(),f=x.createBiquadFilter(),gn=x.createGain();s.buffer=AU.nz;f.type='lowpass';f.frequency.value=fr;gn.gain.setValueAtTime(v,x.currentTime);gn.gain.exponentialRampToValueAtTime(.001,x.currentTime+d);s.connect(f);f.connect(gn);gn.connect(AU.sg);s.start();s.stop(x.currentTime+d)}
const lastS={};
function sfx(k){if(!AU.c||AU.v.mute||AU.v.s<=0)return;const n=performance.now();if(n-(lastS[k]||0)<(k==='shoot'?110:70))return;lastS[k]=n;const d=AU.sg,x=AU.c.currentTime;
 if(k==='shoot')tone(780,.07,'square',.07,d,0,300);else if(k==='hit')tone(240,.05,'triangle',.12,d,0,120);else if(k==='act')tone(380,.09,'square',.1,d,0,820);
 else if(k==='boom'){noise(.35,.5,900);tone(110,.3,'sawtooth',.18,d,0,35)}else if(k==='start')[392,523,659].forEach((f,i)=>tone(f,.15,'square',.1,d,x+i*.09));
 else if(k==='over')[440,370,311,233].forEach((f,i)=>tone(f,.25,'sawtooth',.12,d,x+i*.16));
 else if(k==='good')[523,659,784].forEach((f,i)=>tone(f,.12,'sine',.1,d,x+i*.08));
 else if(k==='wrong')tone(180,.2,'sawtooth',.15,d,0,80)}
function mus(){if(!AU.c)return;const x=AU.c;while(AU.nx<x.currentTime+.3){const sd=60/(110+AU.tp)/2,s=AU.st,bar=Math.floor(s/16)%4,r=AU.root*Math.pow(2,BARS[bar]/12),at=Math.max(AU.nx,x.currentTime);
 if(s%4===0)tone(r/2,sd*3.5,'triangle',.5,AU.mg,at);
 if(s%2===0||s%8===7)tone(r*Math.pow(2,SC[(s*3+bar*2)%SC.length]/12),sd*1.6,'square',.12,AU.mg,at);
 AU.nx+=sd;AU.st++}}
function mStart(i){clearInterval(AU.tm);if(!AU.c)return;AU.root=[220,196,233,175,247,208,185,262,165,277,196,220,175,233,208][i%15];AU.tp=i%5*6;AU.st=0;AU.nx=AU.c.currentTime+.1;AU.tm=setInterval(mus,90)}
function mStop(){clearInterval(AU.tm)}
function sync(){$('mb').textContent=AU.v.mute?'🔇':'🔊';$('mu').checked=AU.v.mute;$('vm').value=AU.v.m*100;$('vs').value=AU.v.s*100}
$('pb').onclick=()=>pause(!paused);$('fb').onclick=fs;
$('mb').onclick=()=>{aInit();AU.v.mute=!AU.v.mute;aApply();sync()};
$('mu').onchange=e=>{AU.v.mute=e.target.checked;aApply();sync()};
$('vm').oninput=e=>{aInit();AU.v.m=e.target.value/100;aApply()};
$('vs').oninput=e=>{aInit();AU.v.s=e.target.value/100;aApply()};$('vs').onchange=()=>sfx('act');
$('rs').onclick=()=>pause(false);$('rt').onclick=()=>{reset();pause(false)};$('ex').onclick=()=>$('back').click();
// Floating fullscreen controls
if($('fsPause'))$('fsPause').onclick=()=>pause(!paused);
if($('fsMute'))$('fsMute').onclick=()=>{aInit();AU.v.mute=!AU.v.mute;aApply();sync()};
if($('fsExit'))$('fsExit').onclick=()=>{if(isFs())fs()};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)b.blur()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(g&&state==='play')pause(true);mStop()}else if(g)mStart(gi)});
sync();

/* ---------- SHARED HELPERS ---------- */
const hit=(a,b,r)=>Math.hypot(a.x-b.x,a.y-b.y)<r;
const hts=(n,m)=>{for(let i=0;i<m;i++)txt(i<n?'♥':'♡',W/2-30+i*30,30,22,'#ff4d6d')};
function steer(p,s,dt,oy){if(keys.arrowleft||keys.a)p.x-=s*dt;if(keys.arrowright||keys.d)p.x+=s*dt;if(keys.arrowup||keys.w)p.y-=s*dt;if(keys.arrowdown||keys.s)p.y+=s*dt;
 if(ptr.on){const f=Math.min(1,dt*9);p.x+=(ptr.x-p.x)*f;p.y+=(ptr.y-(oy||0)-p.y)*f}p.x=cl(p.x,20,W-20);p.y=cl(p.y,40,H-30)}
function bg(a,b){const q=c.createLinearGradient(0,0,0,H);q.addColorStop(0,a);q.addColorStop(1,b);c.fillStyle=q;c.fillRect(0,0,W,H)}
function bar(v,m,x,y,w,col){c.fillStyle='#374151';c.fillRect(x,y,w,10);c.fillStyle=col||'#22c55e';c.fillRect(x,y,w*Math.max(0,v)/m,10)}
function roundRect(x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ================================================================
   1. MATH BLASTER
   ================================================================ */
G.math={
 init(){this.p={x:W/2,y:H-70};this.b=[];this.bub=[];this.cd=0;this.sp=1.2;this.lives=3;this.makeQ()},
 makeQ(){const max=5+Math.floor(t/12)*2,a=1+Math.floor(R()*max),b=1+Math.floor(R()*max),op=R()<.6?'+':'-';
  let ans;if(op==='+')ans=a+b;else{const x=Math.max(a,b),y=Math.min(a,b);this.q=`${x} − ${y}`;ans=x-y;this.ans=ans;this.spawnBubs(ans);return}
  this.q=`${a} + ${b}`;this.ans=ans;this.spawnBubs(ans)},
 spawnBubs(ans){this.bub=[];const opts=new Set([ans]);while(opts.size<4)opts.add(Math.max(0,ans+Math.floor(R()*11)-5));
  [...opts].forEach((v,i)=>this.bub.push({x:60+i*((W-120)/3),y:80+R()*60,v,vy:30+R()*40,vx:(R()-.5)*40,r:28+R()*6}))},

  // check slots if selected

  else if(type==='star'){for(let i=0;i<5;i++){const a=i*1.2566-1.57;c.lineTo(x+Math.cos(a)*sz,y+Math.sin(a)*sz);c.lineTo(x+Math.cos(a+.628)*sz*.4,y+Math.sin(a+.628)*sz*.4)}c.closePath()}

  const bw=Math.min(140,(W-40)/2),bh=70,ox=(W-2*bw)/2,oy=H*.55;
  this.opts.forEach((idx,i)=>{const col=i%2,row=Math.floor(i/2),x=ox+col*bw+8,y=oy+row*(bh+12);
   roundRect(x,y,bw-16,bh,14);c.fillStyle='rgba(99,102,241,.3)';c.fill();
   c.fillStyle=PLANETS[idx].c;c.beginPath();c.arc(x+30,y+bh/2,PLANETS[idx].r*.6,0,7);c.fill();
   c.fillStyle='#e0e7ff';c.font='bold 16px Segoe UI';c.textAlign='left';c.textBaseline='middle';c.fillText(PLANETS[idx].n,x+55,y+bh/2)});
  hts(this.lives,3)}
};

/* ================================================================
   9. COLOR MIXER
   ================================================================ */
const PRIMARIES=[{n:'Red',c:'#ef4444'},{n:'Yellow',c:'#eab308'},{n:'Blue',c:'#3b82f6'}];
const MIXES={
 'Red+Yellow':{n:'Orange',c:'#f97316'},'Yellow+Red':{n:'Orange',c:'#f97316'},
 'Red+Blue':{n:'Purple',c:'#a855f7'},'Blue+Red':{n:'Purple',c:'#a855f7'},
 'Yellow+Blue':{n:'Green',c:'#22c55e'},'Blue+Yellow':{n:'Green',c:'#22c55e'}
};
G.color={
 init(){this.lives=3;this.sel=[];this.newQ()},
 newQ(){const keys=Object.keys(MIXES).filter(k=>k.split('+')[0]<k.split('+')[1]); // unique
  const key=keys[Math.floor(R()*keys.length)];this.target=MIXES[key];this.need=key.split('+');this.sel=[];this.answered=0},
 act(k){if(k!=='tap'||this.answered)return;
  const bw=100,ox=(W-3*bw)/2,oy=H*.55;
  PRIMARIES.forEach((p,i)=>{const x=ox+i*bw+bw/2;
   if(Math.abs(ptr.x-x)<42&&Math.abs(ptr.y-oy)<42){
    if(this.sel.includes(p.n))return;
    this.sel.push(p.n);sfx('act');
    if(this.sel.length===2){this.answered=1;const key=this.sel[0]+'+'+this.sel[1];
     if(MIXES[key]&&MIXES[key].n===this.target.n){score+=15;sfx('good');boom(W/2,oy,'#f472b6',16);setTimeout(()=>this.newQ(),500)}
     else{this.lives--;sfx('wrong');shake=6;if(this.lives<=0)end();else setTimeout(()=>{this.sel=[];this.answered=0},400)}}
   }})},
 update(dt){},
 draw(){bg('#4a044e','#be185d');
  txt('Mix to make',W/2,36,16,'#fbcfe8');
  // target
  c.fillStyle=this.target.c;c.beginPath();c.arc(W/2,H*.28,50,0,7);c.fill();
  c.fillStyle='#fff';c.font='bold 20px Segoe UI';c.textAlign='center';c.textBaseline='middle';c.fillText(this.target.n,W/2,H*.28);
  // selected
  if(this.sel.length){c.fillStyle='#fce7f3';c.font='16px Segoe UI';c.fillText(this.sel.join(' + '),W/2,H*.42)}
  // primaries
  const bw=100,ox=(W-3*bw)/2,oy=H*.55;
  PRIMARIES.forEach((p,i)=>{const x=ox+i*bw+bw/2,sel=this.sel.includes(p.n);
   c.fillStyle=p.c;c.shadowColor=p.c;c.shadowBlur=sel?20:8;c.beginPath();c.arc(x,oy,38,0,7);c.fill();c.shadowBlur=0;
   c.fillStyle='#fff';c.font='bold 14px Segoe UI';c.textAlign='center';c.fillText(p.n,x,oy+55);
   if(sel){c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(x,oy,42,0,7);c.stroke()}});
  hts(this.lives,3)}
};

/* ================================================================
   10. CLOCK MASTER
   ================================================================ */
G.clock={
 init(){this.lives=3;this.newQ()},
 newQ(){this.h=1+Math.floor(R()*12);this.m=[0,15,30,45][Math.floor(R()*4)];
  this.opts=[];const correct=`${this.h}:${this.m.toString().padStart(2,'0')}`;
  const s=new Set([correct]);while(s.size<4){const hh=1+Math.floor(R()*12),mm=[0,15,30,45][Math.floor(R()*4)];s.add(`${hh}:${mm.toString().padStart(2,'0')}`)}
  this.opts=[...s];this.answered=0},
 act(k){if(k!=='tap'||this.answered)return;
  const bw=Math.min(130,(W-40)/2),bh=56,ox=(W-2*bw)/2,oy=H*.62;
  this.opts.forEach((v,i)=>{const col=i%2,row=Math.floor(i/2),x=ox+col*bw+bw/2,y=oy+row*(bh+14);
   if(Math.abs(ptr.x-x)<bw/2-6&&Math.abs(ptr.y-y)<bh/2){this.answered=1;
    const correct=`${this.h}:${this.m.toString().padStart(2,'0')}`;
    if(v===correct){score+=15;sfx('good');boom(x,y,'#60a5fa',14);setTimeout(()=>this.newQ(),450)}
    else{this.lives--;sfx('wrong');shake=6;if(this.lives<=0)end();else setTimeout(()=>{this.answered=0},350)}}})},
 update(dt){},
 draw(){bg('#1e3a8a','#1e40af');
  txt('What time is it?',W/2,30,18,'#bfdbfe');
  // clock face
  const cx=W/2,cy=H*.32,r=Math.min(90,W*.22);
  c.fillStyle='#eff6ff';c.beginPath();c.arc(cx,cy,r,0,7);c.fill();
  c.strokeStyle='#1e40af';c.lineWidth=4;c.stroke();
  // ticks
  for(let i=0;i<12;i++){const a=i*Math.PI/6-Math.PI/2;c.beginPath();c.moveTo(cx+Math.cos(a)*r*.85,cy+Math.sin(a)*r*.85);c.lineTo(cx+Math.cos(a)*r*.95,cy+Math.sin(a)*r*.95);c.stroke()}
  // hands
  const ha=(this.h%12+this.m/60)*Math.PI/6-Math.PI/2,ma=this.m*Math.PI/30-Math.PI/2;
  c.strokeStyle='#1e3a8a';c.lineWidth=5;c.lineCap='round';
  c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(ha)*r*.5,cy+Math.sin(ha)*r*.5);c.stroke();
  c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(ma)*r*.7,cy+Math.sin(ma)*r*.7);c.stroke();
  c.fillStyle='#ef4444';c.beginPath();c.arc(cx,cy,5,0,7);c.fill();
  // options
  const bw=Math.min(130,(W-40)/2),bh=56,ox=(W-2*bw)/2,oy=H*.62;
  this.opts.forEach((v,i)=>{const col=i%2,row=Math.floor(i/2),x=ox+col*bw+6,y=oy+row*(bh+14);
   roundRect(x,y,bw-12,bh,12);c.fillStyle='#3b82f6';c.fill();
   c.fillStyle='#fff';c.font='bold 22px Segoe UI';c.textAlign='center';c.textBaseline='middle';c.fillText(v,x+(bw-12)/2,y+bh/2)});
  hts(this.lives,3)}
};

/* ================================================================
   11. FRACTION PIZZA
   ================================================================ */
G.frac={
 init(){this.lives=3;this.newQ()},
 newQ(){const dens=[2,3,4,5,6,8];this.den=dens[Math.floor(R()*dens.length)];this.num=1+Math.floor(R()*(this.den-1));
  this.opts=[];const s=new Set([this.num+'/'+this.den]);
  while(s.size<4){const d=dens[Math.floor(R()*dens.length)],n=1+Math.floor(R()*(d-1));s.add(n+'/'+d)}
  this.opts=[...s];this.answered=0},
 act(k){if(k!=='tap'||this.answered)return;
  const n=4,bw=Math.min(120,(W-40)/2),bh=90,ox=(W-2*bw)/2,oy=H*.48;
  this.opts.forEach((v,i)=>{const col=i%2,row=Math.floor(i/2),x=ox+col*bw+bw/2,y=oy+row*(bh+16);
   if(Math.abs(ptr.x-x)<bw/2-6&&Math.abs(ptr.y-y)<bh/2){this.answered=1;
    if(v===this.num+'/'+this.den){score+=15;sfx('good');boom(x,y,'#fb923c',14);setTimeout(()=>this.newQ(),450)}
    else{this.lives--;sfx('wrong');shake=6;if(this.lives<=0)end();else setTimeout(()=>{this.answered=0},350)}}})},
 drawPizza(cx,cy,r,num,den){c.fillStyle='#fcd34d';c.beginPath();c.arc(cx,cy,r,0,7);c.fill();
  c.fillStyle='#ef4444';for(let i=0;i<num;i++){const a0=-Math.PI/2+i*2*Math.PI/den,a1=a0+2*Math.PI/den;
   c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r*.92,a0,a1);c.closePath();c.fill()}
  c.strokeStyle='#b45309';c.lineWidth=2;for(let i=0;i<den;i++){const a=-Math.PI/2+i*2*Math.PI/den;
   c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);c.stroke()}
  c.strokeStyle='#92400e';c.lineWidth=3;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke()},
 update(dt){},
 draw(){bg('#7c2d12','#c2410c');
  txt('Which pizza shows  '+this.num+'/'+this.den+'  ?',W/2,32,18,'#fed7aa');
  const bw=Math.min(120,(W-40)/2),bh=90,ox=(W-2*bw)/2,oy=H*.48;
  this.opts.forEach((v,i)=>{const [n,d]=v.split('/').map(Number);const col=i%2,row=Math.floor(i/2);
   const x=ox+col*bw+bw/2,y=oy+row*(bh+16)+bh/2;
   this.drawPizza(x,y,Math.min(38,bw*.35),n,d)});
  hts(this.lives,3)}
};

/* ================================================================
   12. FLAG QUEST
   ================================================================ */
const FLAGS=[
 {n:'Japan',draw:(x,y,w)=>{c.fillStyle='#fff';c.fillRect(x,y,w,w*.6);c.fillStyle='#bc002d';c.beginPath();c.arc(x+w/2,y+w*.3,w*.18,0,7);c.fill()}},
 {n:'France',draw:(x,y,w)=>{c.fillStyle='#002395';c.fillRect(x,y,w/3,w*.6);c.fillStyle='#fff';c.fillRect(x+w/3,y,w/3,w*.6);c.fillStyle='#ed2939';c.fillRect(x+2*w/3,y,w/3,w*.6)}},
 {n:'Germany',draw:(x,y,w)=>{c.fillStyle='#000';c.fillRect(x,y,w,w*.2);c.fillStyle='#dd0000';c.fillRect(x,y+w*.2,w,w*.2);c.fillStyle='#ffce00';c.fillRect(x,y+w*.4,w,w*.2)}},
 {n:'Italy',draw:(x,y,w)=>{c.fillStyle='#009246';c.fillRect(x,y,w/3,w*.6);c.fillStyle='#fff';c.fillRect(x+w/3,y,w/3,w*.6);c.fillStyle='#ce2b37';c.fillRect(x+2*w/3,y,w/3,w*.6)}},
 {n:'Brazil',draw:(x,y,w)=>{c.fillStyle='#009c3b';c.fillRect(x,y,w,w*.6);c.fillStyle='#ffdf00';c.beginPath();c.moveTo(x+w/2,y+4);c.lineTo(x+w-8,y+w*.3);c.lineTo(x+w/2,y+w*.6-4);c.lineTo(x+8,y+w*.3);c.closePath();c.fill();c.fillStyle='#002776';c.beginPath();c.arc(x+w/2,y+w*.3,w*.12,0,7);c.fill()}},
 {n:'Canada',draw:(x,y,w)=>{c.fillStyle='#ff0000';c.fillRect(x,y,w*.25,w*.6);c.fillRect(x+w*.75,y,w*.25,w*.6);c.fillStyle='#fff';c.fillRect(x+w*.25,y,w*.5,w*.6);c.fillStyle='#ff0000';c.font=(w*.35)+'px Segoe UI';c.textAlign='center';c.textBaseline='middle';c.fillText('🍁',x+w/2,y+w*.3)}},
 {n:'India',draw:(x,y,w)=>{c.fillStyle='#ff9933';c.fillRect(x,y,w,w*.2);c.fillStyle='#fff';c.fillRect(x,y+w*.2,w,w*.2);c.fillStyle='#138808';c.fillRect(x,y+w*.4,w,w*.2);c.strokeStyle='#000080';c.lineWidth=1.5;c.beginPath();c.arc(x+w/2,y+w*.3,w*.08,0,7);c.stroke()}},
 {n:'USA',draw:(x,y,w)=>{for(let i=0;i<7;i++){c.fillStyle=i%2?'#fff':'#b22234';c.fillRect(x,y+i*(w*.6/7),w,w*.6/7)}c.fillStyle='#3c3b6e';c.fillRect(x,y,w*.4,w*.32)}}
];
G.flag={
 init(){this.lives=3;this.newQ()},
 newQ(){this.target=Math.floor(R()*FLAGS.length);this.opts=[];const s=new Set([this.target]);
  while(s.size<4)s.add(Math.floor(R()*FLAGS.length));this.opts=[...s];this.answered=0},
 act(k){if(k!=='tap'||this.answered)return;
  const bw=Math.min(140,(W-40)/2),bh=80,ox=(W-2*bw)/2,oy=H*.42;
  this.opts.forEach((idx,i)=>{const col=i%2,row=Math.floor(i/2),x=ox+col*bw+bw/2,y=oy+row*(bh+14);
   if(Math.abs(ptr.x-x)<bw/2-6&&Math.abs(ptr.y-y)<bh/2){this.answered=1;
    if(idx===this.target){score+=15;sfx('good');boom(x,y,'#2dd4bf',14);setTimeout(()=>this.newQ(),450)}
    else{this.lives--;sfx('wrong');shake=6;if(this.lives<=0)end();else setTimeout(()=>{this.answered=0},350)}}})},
 update(dt){},
 draw(){bg('#134e4a','#0f766e');
  txt('Which flag is '+FLAGS[this.target].n+'?',W/2,32,18,'#99f6e4');
  const bw=Math.min(140,(W-40)/2),bh=80,ox=(W-2*bw)/2,oy=H*.42;
  this.opts.forEach((idx,i)=>{const col=i%2,row=Math.floor(i/2),x=ox+col*bw+10,y=oy+row*(bh+14);
   roundRect(x,y,bw-20,bh,10);c.fillStyle='#115e59';c.fill();
   FLAGS[idx].draw(x+12,y+12,bw-44)})
  hts(this.lives,3)}
};
