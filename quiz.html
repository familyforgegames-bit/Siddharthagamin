<style>
:root{--bg:#cfe8ff;--card:#fff;--ink:#222;--hl:#fffde7;--fx:#e1f5fe;--fact:#fff8e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14202e;--card:#222b36;--ink:#eee;--hl:#3a3520;--fx:#1d3445;--fact:#3a3220}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:18px/1.4 "Comic Sans MS","Trebuchet MS",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#43a047;color:#fff;padding:12px 20px;text-align:center;border-bottom:6px solid #2e7d32}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;font-size:14px}
main{max-width:640px;margin:18px auto;padding:0 12px}
.card{background:var(--card);border:4px solid #8d6e63;border-radius:14px;padding:16px;margin-bottom:14px}
.mod{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;cursor:pointer}
.big{background:#ff9800;color:#fff;border:0;border-radius:12px;padding:10px 20px;font-size:18px;box-shadow:0 4px #e65100}
.big.g{background:#78909c;box-shadow:0 4px #455a64}
.big.n{background:#43a047;box-shadow:0 4px #2e7d32}
.big.l2{background:#8e24aa;box-shadow:0 4px #4a148c}
.end .big{margin:6px 4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;background:var(--hl);color:var(--ink);border:3px solid #fbc02d;border-radius:12px;font-size:18px}
.opt.ok{background:#a5d6a7;border-color:#2e7d32;color:#222}
.opt.bad{background:#ef9a9a;border-color:#c62828;color:#222}
.opt:disabled{cursor:default;opacity:.75}
.shake{animation:sk .4s}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#snd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;font-size:22px;background:var(--card);border:3px solid #8d6e63;border-radius:10px;padding:2px 8px;z-index:9}
.pic{text-align:center;margin:8px 0}
.emo{font-size:80px;line-height:1.1}
.bar{height:12px;background:#e0e0e0;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#43a047}
.fx{font-weight:bold;background:var(--fx);border-radius:10px;padding:10px}
.cover{text-align:center}
.cover img{width:100%;border:6px solid #5d4037;border-radius:12px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.cover h2{margin:12px 0 4px;color:#2e7d32}
.note{font-size:14px;color:#b71c1c}
.fact{background:var(--fact);border-left:8px solid #ffb300;border-radius:8px;padding:10px 12px;margin:10px 0}
</style><style id="ff-mobile">
/* Familyforge mobile fixes */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;overflow-x:clip}
button,a,[role=button],input,select,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:820px){input,select,textarea{font-size:16px}} /* stops iOS zoom-on-focus */
</style>

let LV=1, MODS=L1;
const LVS={1:L1,2:L2,3:L3,4:L4};
function setLV(v){LV=v;MODS=LVS[v];home()}
const $=s=>document.querySelector(s);
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const SECOND=1;   // points for a right answer on the 2nd try (1 = full point, 0.5 = half)
let cur=null, SND=true, AC=null;
function art(n){return `<div class="emo">${n}</div>`}

/* ---------- sounds (made by the browser, no files needed) ---------- */
function toggleSnd(){SND=!SND;$('#snd').textContent=SND?'🔊':'🔇'}
function ac(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f1,f2,t0,dur,type,vol){
  const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type;
  o.frequency.setValueAtTime(f1,t);
  o.frequency.linearRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+dur);
}
function rightSound(){
  if(!SND)return;
  tone(523,523,0,.15,'triangle',.2);
  tone(659,659,.15,.15,'triangle',.2);
  tone(784,784,.3,.35,'triangle',.2);
}
function wrongSound(){
  if(!SND)return;
  tone(300,200,0,.25,'sawtooth',.25);
  tone(220,120,.25,.45,'sawtooth',.25);
}

/* ---------- pages ---------- */
function cover(){
  cur=null;
  const ff=sh(MODS.flatMap(m=>m.f))[0];
  $('#app').innerHTML=`<div class="card cover">
  <img src="family.jpg" alt="Our Minecraft family" onerror="this.outerHTML='<p class=note>Put your photo in the same folder and name it family.jpg</p>'">
  <h2>Lionforge Academy for Minecraft Education</h2>
  <p>Lionel Version 🦁</p>
  <div class="fact" style="text-align:left">💡 <b>Fun fact:</b> ${ff}</div>
  <button class="big" onclick="home()">▶ Start Adventure</button></div>`;
}
function home(){
  cur=null;
  const total=MODS.reduce((a,m)=>a+m.q.length,0);
  $('#app').innerHTML=`<div class="card"><h2>Main Menu 🗺️</h2>
  ${[1,2,3,4].map(n=>`<button class="big${LV==n?(n>1?' l2':''):' g'}" onclick="setLV(${n})">${['','🌱','🔥','🧩','👻'][n]} Level ${n}</button>`).join(' ')}<br>
  <small>Level ${LV}${['','',' (harder!)',' (tricky!)',' (myths and facts!)'][LV]} · ${MODS.length} modules · ${total} questions</small></div>`
  +MODS.map((m,i)=>`<div class="card mod"><div><b>${m.e} ${m.t}</b><br><small>${m.q.length} questions + fun facts</small></div><button class="big" onclick="start(${i})">Play!</button></div>`).join('')
  +`<div class="card mod"><div><b>🏆 Final Boss Exam</b><br><small>10 random questions from Level ${LV}</small></div><button class="big" onclick="start('f')">Fight!</button></div>
  <button class="big g" onclick="cover()">🏠 Back to cover</button>`;
}
function start(k){
  ac(); // wakes up the sound on the first click
  const m=k==='f'?{e:"🏆",t:"Final Boss Exam (Level "+LV+")",q:sh(MODS.flatMap(x=>x.q)).slice(0,10)}:MODS[k];
  cur={k,m,n:0,s:0};
  if(m.f)facts();else ask();
}
function facts(){
  const m=cur.m;
  $('#app').innerHTML=`<div class="card"><h2>${m.e} ${m.t}</h2><h3>📚 Fun Facts! Read these first</h3>${m.f.map(x=>`<div class="fact">💡 ${x}</div>`).join('')}<button class="big" onclick="ask()">Start Quiz ▶</button> <button class="big g" onclick="home()">Menu</button></div>`;
}
function ask(){
  const m=cur.m;
  if(cur.n>=m.q.length)return end();
  const [pic,q,o]=m.q[cur.n];
  cur.o=sh(o.map((t,k)=>({t,c:k==0})));
  cur.lock=false;
  cur.tries=0;
  $('#app').innerHTML=`<div class="card"><div class="bar"><i style="width:${cur.n/m.q.length*100}%"></i></div><small>${m.e} ${m.t} · Question ${cur.n+1} of ${m.q.length} · ⭐ ${cur.s}</small><div class="pic">${art(pic)}</div><h2>${q}</h2>${cur.o.map((x,k)=>`<button class="opt" onclick="pick(${k})">${"ABCD"[k]}. ${x.t}</button>`).join('')}<div id="fb"></div></div>`;
}
function pick(k){
  if(cur.lock)return;
  const o=cur.o,fx=cur.m.q[cur.n][3],btn=document.querySelectorAll('.opt');
  const next=`<button class="big" onclick="cur.n++;ask()">Next ➜</button>`;
  if(o[k].c){
    cur.lock=true;
    cur.s+=cur.tries==0?1:SECOND;
    btn[k].classList.add('ok');
    rightSound();
    $('#fb').innerHTML=`<p class="fx">${cur.tries?'👏 Great second try! ':'🎉 Yes! '}${fx}</p>${next}`;
  }else{
    cur.tries++;
    btn[k].classList.add('bad','shake');
    btn[k].disabled=true;
    wrongSound();
    if(cur.tries==1){
      $('#fb').innerHTML=`<p class="fx">😅 Oops! Try again, you have 1 more chance! 💪</p>`;
    }else{
      cur.lock=true;
      btn.forEach((b,j)=>{if(o[j].c)b.classList.add('ok')});
      $('#fb').innerHTML=`<p class="fx">😅 Oops! ${fx}</p>${next}`;
    }
  }
}
function end(){
  const m=cur.m,s=cur.s,t=m.q.length,fl=Math.floor(s);
  const r=s==t?"Diamond Master 💎":s>=t*.7?"Iron Hero ⚔️":s>=t*.4?"Wood Builder 🪵":"Baby Zombie 🧟 (try again!)";
  if(s>=t*.7)rightSound();
  // "Next" button: next module, or the Final Boss Exam after the last module
  let nextBtn="";
  if(typeof cur.k==='number'){
    nextBtn=cur.k<MODS.length-1
      ? `<button class="big n" onclick="start(${cur.k+1})">Next Module ➜</button>`
      : `<button class="big n" onclick="start('f')">Final Boss Exam 🏆</button>`;
  }

  // after Level 1 Final Boss, offer Level 2
  const up=(LV<4&&cur.k==='f'&&s>=t*.7)?`<button class="big l2" onclick="setLV(${LV+1})">🔥 Try Level ${LV+1}</button>`:"";
  $('#app').innerHTML=`<div class="card end" style="text-align:center">
    <h1>${"⭐".repeat(fl)}${"☆".repeat(t-fl)}</h1>
    <h2>${s} / ${t}</h2>
    <h2>${r}</h2>
    ${nextBtn}${up}
    <button class="big" onclick="start(${typeof cur.k==='number'?cur.k:"'f'"})">Play again 🔁</button>
    <button class="big g" onclick="home()">Menu</button>
  </div>`;
}
cover();
</script>
